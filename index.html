<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rdct</title>

<style>
/* =====================================================
   RESET E VARIÁVEIS
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --page-bg: #F5F5F5;
    --page-fg: #1A1A1A;
    --page-hover: #888888;
    --panel-bg: #F5F5F5;
    --panel-border: #cccccc;
    --photo-overlay: rgba(245,245,245,0.55);
    --font-scale: 1;
}

body.dark-mode {
    --page-bg: #1A1A1A;
    --page-fg: #F5F5F5;
    --page-hover: #888888;
    --panel-bg: #1A1A1A;
    --panel-border: #555555;
    --photo-overlay: rgba(26,26,26,0.55);
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: var(--page-bg);
    color: var(--page-fg);
    font-family: sans-serif;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.2s ease, color 0.2s ease;
}

::selection {
    background: rgba(128,128,128,0.35);
    color: inherit;
}

/* =====================================================
   TYPOGRAPHY
===================================================== */

@font-face {
    font-family: "MyFont";
    src: url("https://redesencontros.github.io/rdctsite/ativos/fontes/jost.woff2") format("woff2");
    font-weight: 370;
    font-style: normal;
}

/* =====================================================
   BOIDS BACKGROUND
===================================================== */

#background {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--page-bg);
    opacity: 1;
    transition: opacity 0.6s ease;
}

#canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* =====================================================
   CENA DE ABERTURA
===================================================== */

#openingScene {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page-bg);
    opacity: 1;
    visibility: visible;
    pointer-events: none;
}

#openingLogo {
    display: block;
    width: clamp(60px, 27vw, 105px);
    height: auto;
    opacity: 0;
    transform: scale(1.2);
    transform-origin: center;
    will-change: transform, opacity;
}

#openingScene.playing #openingLogo {
    animation: openingSequence 3.2s linear forwards;
}

@keyframes openingSequence {
    0% {
        opacity: 0;
        transform: scale(1.2);
    }
    18.75% {
        opacity: 1;
        transform: scale(1.25625);
    }
    81.25% {
        opacity: 1;
        transform: scale(1.44375);
    }
    100% {
        opacity: 0;
        transform: scale(1.5);
    }
}

body.intro-active #background,
body.intro-active #header,
body.intro-active #mainMenu,
body.intro-active #homeAnimation,
body.intro-active #siteControls,
body.intro-active #emailContact {
    opacity: 0;
    pointer-events: none;
}

/* =====================================================
   HOME — ANIMAÇÃO DE PALAVRAS
===================================================== */

#homeAnimation {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 90vw;
    text-align: center;
    font-family: MyFont, sans-serif;
    font-weight: 370;
    font-size: calc(16px * var(--font-scale));
    line-height: 1.4;
    color: var(--page-fg);
    pointer-events: none;
    opacity: 0;
    visibility: visible;
    transition: opacity 0.6s ease;
}

#homeAnimation.visible {
    opacity: 1;
}

#homeAnimation.hidden {
    opacity: 0;
    visibility: hidden;
}

#homeWord {
    display: block;
    width: 100%;
    text-align: center;
    overflow-wrap: anywhere;
}

/* =====================================================
   LOGO DO CABEÇALHO
===================================================== */

#header {
    position: fixed;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 45;
    pointer-events: auto;
    cursor: pointer;
    transition: opacity 0.6s ease;
}

#header img {
    display: block;
    width: clamp(30px, 18vw, 70px);
    height: auto;
    cursor: pointer;
}

/* =====================================================
   TYPOGRAPHY SHARED
===================================================== */

#mainMenu,
#emailContact,
#contentWindow,
#siteControls {
    font-family: MyFont, sans-serif;
    font-weight: 370;
    color: var(--page-fg);
}

/* =====================================================
   MAIN MENU
===================================================== */

#mainMenu {
    position: fixed;
    top: 5vh;
    left: 30px;
    transform: none;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    font-size: calc(16px * var(--font-scale));
    line-height: 1.4;
    transition: opacity 0.6s ease;
}

.menuItem {
    position: relative;
    color: var(--page-fg);
    white-space: nowrap;
    cursor: pointer;
    text-transform: none;
    transition: color 0.2s ease;
}

.menuItem:hover {
    color: var(--page-hover);
}

/* =====================================================
   REALIZATIONS DROPDOWN
===================================================== */

#realizationsDropdown {
    display: none;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    margin-top: 5px;
    margin-left: 15px;
}

#realizationsDropdown.open {
    display: flex;
}

.realizationItem {
    color: var(--page-fg);
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.2s ease;
}

.realizationItem:hover {
    color: var(--page-hover);
}

/* =====================================================
   CONTENT WINDOW
===================================================== */

#contentWindow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    width: 100vw;
    max-height: 70vh;
    overflow: hidden;
    font-size: calc(clamp(13px, 1.1vw, 17px) * var(--font-scale));
    line-height: 1.5;
    text-align: left;
    opacity: 0;
    visibility: hidden;
    transition:
        opacity 0.6s ease,
        visibility 0s linear 0.6s;
    pointer-events: none;
}

#contentWindow.open {
    visibility: visible;
    transition:
        opacity 0.6s ease,
        visibility 0s;
}

#contentWindow.open.visible {
    opacity: 1;
    pointer-events: auto;
}

#contentWindow.open:not(.network) {
    display: block;
}

#contentWindow.plain,
#contentWindow.realization {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-radius: 0;
}

/* =====================================================
   CONTENT TEXT
===================================================== */

#contentText {
    width: 100%;
    min-width: 0;
    max-height: 70vh;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;
    padding: 40px max(40px, calc((100vw - 800px) / 2));
    white-space: pre-line;
    color: var(--page-fg);
    overflow-wrap: anywhere;
}

#contentText p {
    margin-top: 0;
    margin-bottom: 1em;
}

/* =====================================================
   INDICADOR DE CARREGAMENTO
===================================================== */

#contentWindow.open.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: min(70vh, 500px);
    max-height: 70vh;
    overflow: hidden;
    text-align: center;
}

#contentWindow.open.loading #contentText {
    display: none;
}

#contentWindow.open.loading::after {
    content: "";
    display: block;
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    border: 2px solid var(--panel-border);
    border-top-color: var(--page-fg);
    border-radius: 50%;
    animation: loadingSpin 0.8s linear infinite;
}

@keyframes loadingSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* =====================================================
   EMAIL
===================================================== */

#emailContact {
    position: fixed;
    bottom: 3vh;
    right: 30px;
    z-index: 50;
    text-align: right;
    white-space: nowrap;
    font-size: calc(16px * var(--font-scale));
    -webkit-user-select: text;
    user-select: text;
    transition: opacity 0.6s ease;
}

#emailContact a {
    color: var(--page-fg);
    text-decoration: none;
    cursor: pointer;
    -webkit-user-select: text;
    user-select: text;
    transition: color 0.2s ease;
}

#emailContact a:hover {
    color: var(--page-hover);
}

/* =====================================================
   CONTROLES DO SITE
===================================================== */

#siteControls {
    position: fixed;
    left: 30px;
    bottom: 3vh;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: calc(14px * var(--font-scale));
    line-height: 1;
    white-space: nowrap;
    transition: opacity 0.6s ease;
}

.controlGroup {
    display: flex;
    align-items: center;
    gap: 5px;
}

.siteControl {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--page-fg);
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    cursor: pointer;
    padding: 3px 4px;
    transition: color 0.2s ease;
}

.siteControl:hover {
    color: var(--page-hover);
}

.siteControl.active {
    text-decoration: underline;
    text-underline-offset: 3px;
}

.controlDivider {
    width: 1px;
    height: 15px;
    background: var(--panel-border);
}

/* =====================================================
   REDE — JANELA E NAVEGAÇÃO POR MOVIMENTOS
===================================================== */

#contentWindow.network {
    display: none;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    position: fixed;
    width: 100vw;
    height: 50vh;
    max-height: 50vh;
    overflow: hidden;
}

#contentWindow.network.open {
    display: flex;
}

/* TÍTULO FIXO */

#networkFixedHeader {
    display: none;
    flex: 0 0 auto;
    width: 100%;
    padding: 0 20px 12px;
    text-align: center;
    font-size: 1em;
    line-height: 1.4;
    font-weight: 700;
    color: var(--page-fg);
}

#contentWindow.network.open #networkFixedHeader {
    display: block;
}

/* CARREGAMENTO */

#contentWindow.network.open.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 50vh;
    max-height: 50vh;
    overflow: hidden;
}

#contentWindow.network.open.loading #networkFixedHeader,
#contentWindow.network.open.loading #contentText,
#contentWindow.network.open.loading #networkStepControl {
    display: none;
}

/* JANELA DE EXIBIÇÃO */

#contentWindow.network #contentText {
    display: block;
    position: relative;
    flex: 1 1 0;
    width: 100%;
    height: 0;
    min-height: 0;
    max-height: none;
    padding: 0;
    overflow: hidden;
    overscroll-behavior: none;
    white-space: normal;
    text-align: center;
    scrollbar-width: none;
    touch-action: pan-y;
}

#contentWindow.network #contentText::-webkit-scrollbar {
    display: none;
}

/* SEQUÊNCIA DE MOVIMENTOS */

#networkContent {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    min-height: 0;
    transform: translateY(0);
    transition: transform 550ms cubic-bezier(0.22, 0.61, 0.36, 1);
    will-change: transform;
}

/* CADA PARADA TEM A ALTURA EXATA DA JANELA */

#networkContent .networkStop {
    flex: 0 0 var(--network-step-height, 1px);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    height: var(--network-step-height, 1px);
    min-height: 0;
    max-height: var(--network-step-height, 1px);
    padding: 12px 20px;
    overflow: hidden;
}

/* NÚCLEO REGULAR — QUATRO INTEGRANTES NA MESMA JANELA */

#networkContent .networkCore {
    padding: 12px 20px;
}

#networkContent .networkCore > .networkCategory {
    display: none;
}

#networkContent .networkCore .networkPeople {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: minmax(0, 1fr);
    align-items: center;
    justify-items: center;
    align-content: center;
    width: calc(100% - 48px);
    height: 100%;
    min-height: 0;
    margin-right: auto;
    gap: 14px;
    max-width: 900px;
margin-left: auto;
margin-right: auto;
}

#networkContent .networkCore .networkPerson {
    --network-photo-size: min(24vh, 22vw, 260px);
    cursor: default;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    height: 100%;
    text-align: center;
}

#networkContent .networkCore .networkPerson::before {
    display: none;
}

#networkContent .networkCore .networkPhoto {
    display: block;
    cursor: pointer;
    flex: 0 1 auto;
    width: var(--network-photo-size);
    max-width: 100%;
    min-width: 0;
    color: inherit;
}

#networkContent .networkCore .networkPhoto img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    margin: 0;
}

#networkContent .networkCore .networkBio {
    flex: 0 0 auto;
    width: 100%;
    min-width: 0;
    padding: 0;
    text-align: center;
}

#networkContent .networkCore .networkName {
    display: inline-block;
    cursor: pointer;
    max-width: 100%;
    margin: 0;
    color: var(--page-fg);
    font-size: 1em;
    line-height: 1.3;
    text-align: center;
    overflow-wrap: anywhere;
}

/* INTEGRANTES */

#networkContent .networkPerson {
    --network-photo-size: clamp(200px, 30vh, 250px);
    position: relative;
    cursor: default;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: fit-content;
    max-width: 100%;
    color: var(--page-fg);
    text-decoration: none;
}

/* FOTOGRAFIA */

#networkContent .networkPerson img {
    display: block;
    cursor: pointer;
    width: var(--network-photo-size);
    height: var(--network-photo-size);
    max-width: 100%;
    margin: 0 0 10px;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: center;
}

/* SEM SOBREPOSIÇÃO DE COR SOBRE A FOTO */

/* NOME */

#networkContent .networkPerson span {
    display: block;
    position: relative;
    cursor: pointer;
    color: var(--page-fg);
    text-align: center;
    text-decoration: none;
    line-height: 1.3;
    transition: color 0.2s ease;
}

#networkContent .networkPerson span:hover {
    color: var(--page-hover);
}

/* LINKS */

#contentWindow.network #contentText a.networkPerson,
#contentWindow.network #contentText a.networkPerson:link,
#contentWindow.network #contentText a.networkPerson:visited {
    color: var(--page-fg);
    text-decoration: none;
}

/* MINIBIO */

#networkContent .networkPerson p {
    display: block;
    width: min(100%, 420px);
    margin: 8px auto 0;
    font-size: 0.9em;
    line-height: 1.45;
    font-weight: 370;
    text-align: center;
    overflow-wrap: anywhere;
}

/* PARCERIAS */

#networkContent .networkPartnerships {
    padding: 12px 20px;
}

#networkContent .networkPartners {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-height: 0;
    max-height: 100%;
    overflow: hidden;
    gap: 7px;
}

#networkContent .networkPartners a {
    display: block;
    max-width: 100%;
    color: var(--page-fg);
    text-decoration: none;
    text-align: center;
    line-height: 1.35;
    overflow-wrap: anywhere;
    transition: color 0.2s ease;
}

#networkContent .networkPartners a:hover {
    color: var(--page-hover);
}

/* =====================================================
   REDE — INDICADOR MORFOLÓGICO DE NAVEGAÇÃO
===================================================== */

#contentWindow.network {
    overflow: visible;
}

/* BOTÃO */

#networkStepControl {
    appearance: none;
    position: absolute;
    left: 50%;
    bottom: -39px;
    top: auto;
    transform: translateX(-50%);
    z-index: 35;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 42px;
    height: 30px;
    padding: 0;

    border: none;
    background: transparent;
    color: var(--page-fg);

    cursor: pointer;

    transition:
        color 0.2s ease,
        transform 0.2s ease;
}

/* SVG */

#networkArrow {
    display: block;
    width: 42px;
    height: 30px;
    overflow: visible;
}

/* FORMA */

#networkArrowShape {
    fill: currentColor;
}

/* HOVER */

#networkStepControl:hover {
    color: var(--page-hover);
    transform: translate(-50%, 3px);
}

/* HOVER NAS PARCERIAS */

#networkStepControl.partnerships:hover {
    transform: translate(-50%, -3px);
}

/* FOCO DE TECLADO */

#networkStepControl:focus-visible {
    outline: 1px solid var(--page-hover);
    outline-offset: 3px;
}

/* OCULTA QUANDO NÃO HÁ OUTRO MOVIMENTO */

#networkStepControl[hidden] {
    display: none;
}

/* MOVIMENTO REDUZIDO */

@media (prefers-reduced-motion: reduce) {
    #networkStepControl {
        transition-duration: 0.01ms;
    }
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #header {
        top: 35px;
        right: 25px;
        left: auto;
        transform: none;
    }

    #header img {
        width: clamp(40px, 18vw, 70px);
    }

    #mainMenu {
        top: 35px;
        left: 20px;
        transform: none;
        font-size: calc(13px * var(--font-scale));
        gap: 5px;
    }

    #realizationsDropdown {
        margin-left: 12px;
        gap: 5px;
    }

    #homeAnimation {
        width: calc(100vw - 40px);
        font-size: calc(13px * var(--font-scale));
    }

    #contentWindow {
        width: 100vw;
        max-width: none;
        max-height: 65vh;
        border-radius: 10px;
    }

    #contentText {
        max-height: 65vh;
        padding: 25px 20px;
        font-size: calc(clamp(12px, 3.2vw, 19px) * var(--font-scale));
        line-height: 1.4;
    }

    #contentWindow.open.loading {
        height: 65vh;
        max-height: 65vh;
    }

    #contentWindow.open.loading::after {
        width: 26px;
        height: 26px;
        flex-basis: 26px;
    }

    /* REDE */

    #contentWindow.network {
        width: 100vw;
        height: 50vh;
        max-height: 50vh;
    }

    #contentWindow.network #contentText {
        padding: 0;
        font-size: calc(11px * var(--font-scale));
        line-height: 1.4;
    }

    #networkContent .networkPerson {
        --network-photo-size: min(140px, calc(100vw - 40px));
    }

    #networkContent .networkCore {
        padding: 10px 12px;
    }

    #networkContent .networkCore .networkPeople {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        width: calc(100% - 34px);
        gap: 8px 10px;
    }

    #networkContent .networkCore .networkPerson {
        --network-photo-size: min(17vh, 100%, calc((100vw - 90px) / 2));
        gap: 5px;
    }

    #networkContent .networkCore .networkName {
        font-size: 0.95em;
    }

    #networkContent .networkStop {
        padding: 10px 18px;
    }

    #networkContent .networkPartners {
        gap: 6px;
    }

       #emailContact {
        bottom: 20px;
        right: 20px;
        font-size: calc(13px * var(--font-scale));
    }

    #siteControls {
        left: 20px;
        bottom: 20px;
        gap: 8px;
        font-size: calc(12px * var(--font-scale));
    }
}

/* =====================================================
   TELAS COM POUCA ALTURA
===================================================== */

@media (max-height: 600px) {

    #contentWindow.network {
        height: 50vh;
        max-height: 50vh;
    }

    #networkContent .networkPerson {
        --network-photo-size: min(115px, calc(100vw - 40px));
    }

    #networkContent .networkCore .networkPerson {
        --network-photo-size: min(19vh, 21vw, 210px);
    }

    #networkContent .networkStop {
        padding-top: 6px;
        padding-bottom: 6px;
    }

    #networkContent .networkPartnerships {
        padding-top: 8px;
        padding-bottom: 8px;
    }

    #networkContent .networkPartners {
        gap: 4px;
    }
}

/* =====================================================
   PULL TO REFRESH
===================================================== */

#pullIndicator {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translate(-50%, -50px);
    z-index: 9999;
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--panel-bg);
    color: var(--page-fg);
    font-family: MyFont, sans-serif;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

#pullIndicator.visible {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* =====================================================
   MOBILE — ORIENTAÇÃO HORIZONTAL
===================================================== */

@media (orientation: landscape) and
(max-height: 600px) and
(max-width: 950px) {

    #header {
        top: 15px;
        right: 20px;
        left: auto;
        transform: none;
    }

    #header img {
        width: clamp(40px, 9vw, 70px);
    }

    #mainMenu {
        top: 15px;
        left: 20px;
        right: 100px;
        transform: none;
        flex-direction: row;
        align-items: flex-start;
        gap: 18px;
        font-size: calc(12px * var(--font-scale));
        line-height: 1.3;
    }

    #realizationsDropdown {
        position: absolute;
        top: 22px;
        left: 150px;
        margin: 0;
        padding: 8px 12px;
        max-height: calc(100dvh - 75px);
        overflow-y: auto;
        background: var(--panel-bg);
        gap: 5px;
    }

    #homeAnimation {
        width: 85vw;
        font-size: calc(12px * var(--font-scale));
    }

    #contentWindow {
        top: 55%;
        width: 100vw;
        max-width: none;
        max-height: 70dvh;
    }

    #contentText {
        max-height: 70dvh;
        padding: 12px 20px;

<script>

/* =====================================================
   CONFIGURAÇÕES GERAIS
===================================================== */

const LOGO_LIGHT =
    "https://raw.githubusercontent.com/redesencontros/rdctsite/8cf3ec8ef2db295bfd288276372b4631fe39179f/ativos/logos/rdctpt.png";

const LOGO_DARK =
    "https://raw.githubusercontent.com/redesencontros/rdctsite/8cf3ec8ef2db295bfd288276372b4631fe39179f/ativos/logos/rdctbr.png";


/* =====================================================
   IDIOMA E PREFERÊNCIAS
===================================================== */

let currentLanguage =
    localStorage.getItem("rdct-language") || "pt";

let isDarkMode =
    localStorage.getItem("rdct-dark-mode") === "true";


/* =====================================================
   PALAVRAS DA HOME — PT / EN / ES
===================================================== */

const homeWords = {

    pt: [
        "ARTE",
        "CULTURA",
        "EDUCAÇÃO",
        "COMUNIDADE",
        "TERRITÓRIO",
        "CRIAÇÃO",
        "PESQUISA",
        "EXPERIMENTAÇÃO",
        "DIÁLOGO",
        "MULTIPLICIDADE",
        "COOPERAÇÃO",
        "MEMÓRIA"
    ],

    en: [
        "ART",
        "CULTURE",
        "EDUCATION",
        "COMMUNITY",
        "TERRITORY",
        "CREATION",
        "RESEARCH",
        "EXPERIMENTATION",
        "DIALOGUE",
        "MULTIPLICITY",
        "COOPERATION",
        "MEMORY"
    ],

    es: [
        "ARTE",
        "CULTURA",
        "EDUCACIÓN",
        "COMUNIDAD",
        "TERRITORIO",
        "CREACIÓN",
        "INVESTIGACIÓN",
        "EXPERIMENTACIÓN",
        "DIÁLOGO",
        "MULTIPLICIDAD",
        "COOPERACIÓN",
        "MEMORIA"
    ]

};


/* =====================================================
   CENA DE ABERTURA
===================================================== */

const openingScene =
    document.getElementById("openingScene");

const openingLogo =
    document.getElementById("openingLogo");

const OPENING_DELAY = 1000;
const OPENING_TOTAL_DURATION = 3200;

let openingStarted = false;


function runOpeningScene() {

    if (openingStarted) return;

    openingStarted = true;

    openingLogo.src =
        isDarkMode ? LOGO_DARK : LOGO_LIGHT;

    setTimeout(() => {

        openingScene.classList.remove("playing");

        void openingLogo.offsetWidth;

        openingScene.classList.add("playing");

    }, OPENING_DELAY);

}


openingLogo.addEventListener("animationend", event => {

    if (event.animationName !== "openingSequence") return;

    openingScene.classList.remove("playing");

    openingScene.style.display = "none";

    document.body.classList.remove("intro-active");

    startHomeAnimation();

});


/* =====================================================
   HOME — CONTROLE DA ANIMAÇÃO DE PALAVRAS
===================================================== */

const homeAnimation =
    document.getElementById("homeAnimation");

const homeWord =
    document.getElementById("homeWord");

const HOME_INITIAL_DELAY = 2000;
const HOME_FADE_DURATION = 600;
const HOME_VISIBLE_DURATION = 2000;

let homeTimeout = null;
let homeExitTimeout = null;
let homeExitCallbacks = [];

let homeDeck = [];
let lastHomeWordIndex = null;
let currentHomeWordIndex = null;
let homeAnimationActive = false;


function getHomeWords() {
    return homeWords[currentLanguage] || homeWords.pt;
}


function shuffleHomeDeck() {

    const wordCount = homeWords.pt.length;

    const deck = Array.from(
        { length: wordCount },
        (_, index) => index
    );

    for (let i = deck.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [deck[i], deck[j]] = [deck[j], deck[i]];

    }

    if (
        deck.length > 1 &&
        deck[0] === lastHomeWordIndex
    ) {

        const swapIndex =
            1 + Math.floor(Math.random() * (deck.length - 1));

        [deck[0], deck[swapIndex]] =
        [deck[swapIndex], deck[0]];

    }

    return deck;
}


function createHomeDeck() {
    homeDeck = shuffleHomeDeck();
}


function showRandomHomeWord() {

    if (homeDeck.length === 0) {
        createHomeDeck();
    }

    if (homeDeck.length === 0) return;

    const index = homeDeck.shift();

    currentHomeWordIndex = index;
    lastHomeWordIndex = index;

    const words = getHomeWords();

    homeWord.textContent = words[index];
}


function runHomeWordCycle() {

    if (!homeAnimationActive) return;

    showRandomHomeWord();

    homeAnimation.classList.remove("hidden");

    requestAnimationFrame(() => {

        if (!homeAnimationActive) return;

        requestAnimationFrame(() => {
            homeAnimation.classList.add("visible");
        });

    });

    homeTimeout = setTimeout(() => {

        if (!homeAnimationActive) return;

        homeAnimation.classList.remove("visible");

        homeTimeout = setTimeout(() => {

            if (!homeAnimationActive) return;

            runHomeWordCycle();

        }, HOME_FADE_DURATION);

    }, HOME_FADE_DURATION + HOME_VISIBLE_DURATION);
}


function startHomeAnimation() {

    stopHomeAnimation();

    if (!getHomeWords().length) return;

    homeAnimationActive = true;

    homeAnimation.classList.remove("visible");
    homeAnimation.classList.add("hidden");

    homeTimeout = setTimeout(() => {

        if (!homeAnimationActive) return;

        runHomeWordCycle();

    }, HOME_INITIAL_DELAY);
}


function finishHomeAnimation(callback) {

    if (callback) {
        homeExitCallbacks.push(callback);
    }

    if (homeExitTimeout !== null) return;

    const wasVisible =
        homeAnimation.classList.contains("visible");

    homeAnimationActive = false;

    if (homeTimeout !== null) {
        clearTimeout(homeTimeout);
        homeTimeout = null;
    }

    if (wasVisible) {

        homeAnimation.classList.remove("visible");

        homeExitTimeout = setTimeout(() => {

            homeAnimation.classList.add("hidden");

            homeExitTimeout = null;

            const callbacks = homeExitCallbacks.splice(0);
            callbacks.forEach(fn => fn());

        }, HOME_FADE_DURATION);

    } else {

        homeAnimation.classList.add("hidden");

        const callbacks = homeExitCallbacks.splice(0);
        callbacks.forEach(fn => fn());

    }
}


function stopHomeAnimation() {

    homeAnimationActive = false;

    if (homeTimeout !== null) {
        clearTimeout(homeTimeout);
        homeTimeout = null;
    }

    if (homeExitTimeout !== null) {
        clearTimeout(homeExitTimeout);
        homeExitTimeout = null;
    }

    homeExitCallbacks = [];

    homeAnimation.classList.remove("visible");
    homeAnimation.classList.add("hidden");
}


/* =====================================================
   TEXTO ALTERNATIVO HOME
===================================================== */

function updateLogoTitle() {

    const logo = document.getElementById("headerImage");

    const titles = {
        pt: "Início",
        en: "Home",
        es: "Inicio"
    };

    if (logo) {
        logo.title = titles[currentLanguage] || "Início";
    }
}


/* =====================================================
   BOIDS BACKGROUND
===================================================== */

const canvas = document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: true
    }) ||
    canvas.getContext("experimental-webgl");

if (!gl) {
    throw new Error("WebGL não disponível.");
}

let width;
let height;
let pixelRatio = 1;


function resize() {

    pixelRatio = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);

    gl.viewport(0, 0, canvas.width, canvas.height);
}

window.addEventListener("resize", resize);
resize();


const vertexShaderSource = `
attribute vec2 a_position;

uniform vec2 u_resolution;
uniform float u_pixelRatio;

void main() {

    vec2 zeroToOne = a_position / u_resolution;
    vec2 zeroToTwo = zeroToOne * 2.0;
    vec2 clipSpace = zeroToTwo - 1.0;

    gl_Position = vec4(
        clipSpace * vec2(1, -1),
        0,
        1
    );

    gl_PointSize = 1.5 * u_pixelRatio;

}`;

const fragmentShaderSource = `
precision mediump float;

void main() {

    gl_FragColor = vec4(
        0.5333333,
        0.5333333,
        0.5333333,
        0.4
    );

}`;


function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        throw new Error("Erro ao compilar shader.");
    }

    return shader;
}


const vertexShader = createShader(
    gl.VERTEX_SHADER,
    vertexShaderSource
);

const fragmentShader = createShader(
    gl.FRAGMENT_SHADER,
    fragmentShaderSource
);

const program = gl.createProgram();

gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);
gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    throw new Error("Erro ao criar programa WebGL.");
}

gl.useProgram(program);

gl.enable(gl.BLEND);

gl.blendFunc(
    gl.SRC_ALPHA,
    gl.ONE_MINUS_SRC_ALPHA
);

const positionLocation =
    gl.getAttribLocation(program, "a_position");

const resolutionLocation =
    gl.getUniformLocation(program, "u_resolution");

const pixelRatioLocation =

const positionBuffer = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

/* BOIDS CONFIGURATION */

const isMobile = window.innerWidth < 768;
const BOID_COUNT = isMobile ? 1500 : 4000;

const boids = [];

let frame = 0;

const perception = 22;
const cellSize = perception;

let grid = {};


function buildGrid() {

    grid = {};

    for (let i = 0; i < boids.length; i++) {

        const b = boids[i];

        const cx = Math.floor(b.x / cellSize);
        const cy = Math.floor(b.y / cellSize);

        const key = cx + "," + cy;

        if (!grid[key]) grid[key] = [];

        grid[key].push(b);
    }
}


function getNearbyBoids(boid) {

    const cx = Math.floor(boid.x / cellSize);
    const cy = Math.floor(boid.y / cellSize);

    let neighbors = [];

    for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {

            const key = (cx + x) + "," + (cy + y);

            if (grid[key]) {
                neighbors = neighbors.concat(grid[key]);
            }
        }
    }

    return neighbors;
}


/* GLOBAL FLOW */

let flowTime = 0;
const flowScale = 0.003;
let wavePhase = 0;

const entrySide = Math.floor(Math.random() * 4);


/* BOID CLASS */

class Boid {

    constructor() {

        const clusterRadius = 150;
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * clusterRadius;
        const far = 300;

        if (entrySide === 0) {

            this.x = -far + Math.cos(angle) * r;
            this.y = height / 2 + Math.sin(angle) * r;

            this.vx = 3.5;
            this.vy = (Math.random() - 0.5) * 0.4;
        }

        if (entrySide === 1) {

            this.x = width + far + Math.cos(angle) * r;
            this.y = height / 2 + Math.sin(angle) * r;

            this.vx = -3.5;
            this.vy = (Math.random() - 0.5) * 0.4;
        }

        if (entrySide === 2) {

            this.x = width / 2 + Math.cos(angle) * r;
            this.y = -far + Math.sin(angle) * r;

            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = 3.5;
        }

        if (entrySide === 3) {

            this.x = width / 2 + Math.cos(angle) * r;
            this.y = height + far + Math.sin(angle) * r;

            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = -3.5;
        }
    }


    update() {

        let alignX = 0;
        let alignY = 0;

        let cohesionX = 0;
        let cohesionY = 0;

        let separationX = 0;
        let separationY = 0;

        let count = 0;

        const perceptionSq = perception * perception;
        const neighbors = getNearbyBoids(this);

        for (let other of neighbors) {

            if (other === this) continue;

            const dx = other.x - this.x;
            const dy = other.y - this.y;

            const distSq = dx * dx + dy * dy;

            if (distSq < perceptionSq) {

                alignX += other.vx;
                alignY += other.vy;

                cohesionX += other.x;
                cohesionY += other.y;

                if (distSq < 60) {
                    separationX -= dx;
                    separationY -= dy;
                }

                count++;
            }
        }

        if (count > 0) {

            alignX /= count;
            alignY /= count;

            cohesionX /= count;
            cohesionY /= count;

            this.vx += (alignX - this.vx) * 0.05;
            this.vy += (alignY - this.vy) * 0.05;

            this.vx += (cohesionX - this.x) * 0.001;
            this.vy += (cohesionY - this.y) * 0.001;

            this.vx += separationX * 0.02;
            this.vy += separationY * 0.02;
        }

        const globalPull = 0.0001;

        const driftX =
            width / 2 +
            Math.sin(flowTime * 0.2) * width * 0.35;

        const driftY =
            height / 2 +
            Math.cos(flowTime * 0.15) * height * 0.35;

        this.vx += (driftX - this.x) * globalPull;
        this.vy += (driftY - this.y) * globalPull;

        this.vy += (height / 2 - this.y) * 0.00001;

        this.vx += Math.sin(wavePhase + this.x * 0.01) * 0.05;
        this.vy += Math.cos(wavePhase + this.y * 0.01) * 0.05;

        const nx = this.x * flowScale;
        const ny = this.y * flowScale;

        const fx = Math.sin(nx + flowTime);
        const fy = Math.cos(ny + flowTime * 0.8);

        this.vx += fx * 0.05;
        this.vy += fy * 0.05;

        this.vx += Math.sin(flowTime * 0.2) * 0.01;

        this.vx += (Math.random() - 0.5) * 0.03;
        this.vy += (Math.random() - 0.5) * 0.03;

        const margin = 120;
        const push = 0.002;

        if (this.x < margin) this.vx += push;
        if (this.x > width - margin) this.vx -= push;
        if (this.y < margin) this.vy += push;
        if (this.y > height - margin) this.vy -= push;

        const speedSq =
            this.vx * this.vx +
            this.vy * this.vy;

        const maxSpeed = 3.5;

        if (speedSq > maxSpeed * maxSpeed) {

            const scale = maxSpeed / Math.sqrt(speedSq);

            this.vx *= scale;
            this.vy *= scale;
        }

        this.x += this.vx;
        this.y += this.vy;
    }
}


/* INITIALIZE BOIDS */

for (let i = 0; i < BOID_COUNT; i++) {

/* ANIMATION LOOP */

function animate() {

    frame++;

    flowTime += 0.004;
    wavePhase += 0.015;

    buildGrid();

    for (let i = 0; i < boids.length; i++) {

        if (i % 10 === frame % 10) {
            boids[i].update();
        }

        positions[i * 2] = boids[i].x;
        positions[i * 2 + 1] = boids[i].y;
    }

    const dark =
        document.body.classList.contains("dark-mode");

    const backgroundColor =
        dark ? 26 / 255 : 245 / 255;

    gl.clearColor(
        backgroundColor,
        backgroundColor,
        backgroundColor,
        1
    );

    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform2f(
        resolutionLocation,
        width,
        height
    );

    gl.uniform1f(
        pixelRatioLocation,
        pixelRatio
    );

    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

    gl.bufferSubData(
        gl.ARRAY_BUFFER,
        0,
        positions
    );

    gl.drawArrays(
        gl.POINTS,
        0,
        BOID_COUNT
    );

    requestAnimationFrame(animate);
}

const ARROW_ANIMATION_DURATION = 450;
const ARROW_POINT_COUNT = 48;

let networkArrowFrame = null;


/* ÁREA DE UM POLÍGONO */

function getPolygonArea(points) {

    let area = 0;

    for (let i = 0; i < points.length; i++) {

        const next = (i + 1) % points.length;

        area +=
            points[i].x * points[next].y -
            points[next].x * points[i].y;

    }

    return Math.abs(area) / 2;
}


/* CENTRO DE UM POLÍGONO */

function getPolygonCenter(points) {

    let x = 0;
    let y = 0;

    points.forEach(point => {
        x += point.x;
        y += point.y;
    });

    return {
        x: x / points.length,
        y: y / points.length
    };
}


/* GERA PONTOS UNIFORMEMENTE DISTRIBUÍDOS
   AO REDOR DO CENTRO DE UMA FORMA */

function getRadialPolygon(vertices, count) {

    const center = getPolygonCenter(vertices);
    const points = [];

    for (let i = 0; i < count; i++) {

        const angle =
            (Math.PI * 2 * i) / count;

        const dx = Math.cos(angle);
        const dy = Math.sin(angle);

        let nearestDistance = Infinity;

        for (let j = 0; j < vertices.length; j++) {

            const a = vertices[j];
            const b = vertices[(j + 1) % vertices.length];

            const ax = a.x - center.x;
            const ay = a.y - center.y;

            const ex = b.x - a.x;
            const ey = b.y - a.y;

            const denominator =
                dx * ey - dy * ex;

            if (Math.abs(denominator) < 0.000001) {
                continue;
            }

            const distance =
                (ax * ey - ay * ex) / denominator;

            const edgePosition =
                (ax * dy - ay * dx) / denominator;

            if (
                distance >= 0 &&
                edgePosition >= -0.000001 &&
                edgePosition <= 1.000001
            ) {
                nearestDistance = Math.min(
                    nearestDistance,
                    distance
                );
            }

        }

        points.push({
            x: center.x + dx * nearestDistance,
            y: center.y + dy * nearestDistance
        });

    }

    return points;
}


/* CÍRCULO COM A MESMA ÁREA DO TRIÂNGULO */

function createEqualAreaCircle(count, area) {

    const center = { x: 21, y: 14.5 };

    const radius = Math.sqrt(area / Math.PI);

    const points = [];

    for (let i = 0; i < count; i++) {

        const angle =
            (Math.PI * 2 * i) / count;

        points.push({
            x: center.x + Math.cos(angle) * radius,
            y: center.y + Math.sin(angle) * radius
        });

    }

    return points;
}


/* FORMAS INICIAIS */

const arrowDown = getRadialPolygon([
    { x: 12, y: 9 },
    { x: 30, y: 9 },
    { x: 21, y: 20 }
], ARROW_POINT_COUNT);

const arrowUp = getRadialPolygon([
    { x: 12, y: 20 },
    { x: 30, y: 20 },
    { x: 21, y: 9 }
], ARROW_POINT_COUNT);

const arrowArea = getPolygonArea([
    { x: 12, y: 9 },
    { x: 30, y: 9 },
    { x: 21, y: 20 }
]);

const arrowCircle =
    createEqualAreaCircle(
        ARROW_POINT_COUNT,
        arrowArea
    );


/* EASING SUAVE */

function arrowEase(value) {

    return value < 0.5
        ? 4 * value * value * value
        : 1 - Math.pow(-2 * value + 2, 3) / 2;

}


/* INTERPOLAÇÃO ENTRE DUAS FORMAS */

function interpolateArrow(from, to, progress) {

    const points = from.map((point, index) => {

        return {
            x: point.x + (to[index].x - point.x) * progress,
            y: point.y + (to[index].y - point.y) * progress
        };

    });

    /* Normaliza a área para que a forma não aumente
       nem diminua durante a transformação. */

    const currentArea = getPolygonArea(points);

    if (currentArea > 0) {

        const scale = Math.sqrt(
            arrowArea / currentArea
        );

        const center = getPolygonCenter(points);

        points.forEach(point => {

            point.x =
                center.x + (point.x - center.x) * scale;

            point.y =
                center.y + (point.y - center.y) * scale;

        });

    }

    return points;
}


/* DESENHA A FORMA */

function renderArrow(points) {

    networkArrowShape.setAttribute(
        "points",
        points.map(point =>
            `${point.x.toFixed(3)},${point.y.toFixed(3)}`
        ).join(" ")
    );

}


/* ANIMAÇÃO TRIÂNGULO → CÍRCULO → TRIÂNGULO */

function animateNetworkArrow(toPartnerships) {

    if (networkArrowFrame !== null) {
        cancelAnimationFrame(networkArrowFrame);
        networkArrowFrame = null;
    }

    const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;

    const from = toPartnerships ? arrowDown : arrowUp;
    const to = toPartnerships ? arrowUp : arrowDown;

    if (reducedMotion) {
        renderArrow(to);
        return;
    }

    const startTime = performance.now();

    function animate(now) {

        const elapsed = now - startTime;

        const progress = Math.min(
            elapsed / ARROW_ANIMATION_DURATION,
            1
        );

        const eased = arrowEase(progress);

        let points;

        if (eased < 0.5) {

            points = interpolateArrow(
                from,
                arrowCircle,
                eased * 2
            );

        } else {

            points = interpolateArrow(
                arrowCircle,
                to,
                (eased - 0.5) * 2
            );

        }

        renderArrow(points);

        if (progress < 1) {

            networkArrowFrame =
                requestAnimationFrame(animate);

        } else {

            renderArrow(to);
            networkArrowFrame = null;

        }

    }

    networkArrowFrame =
        requestAnimationFrame(animate);

}

/* CALCULA A ALTURA REAL DA JANELA */

function fitNetworkPartnerships() {

    const partners =
        networkViewport.querySelector(".networkPartners");

    if (!partners) return;

    const links = Array.from(partners.querySelectorAll("a"));

    if (!links.length) return;

    /* Começa sempre pela escala natural, para que o ajuste não
       vá diminuindo progressivamente a cada redimensionamento. */
    partners.style.fontSize = "1em";
    partners.style.gap = "7px";

    const availableHeight = partners.clientHeight;

    if (!availableHeight) return;

    const fits = () =>
        partners.scrollHeight <= availableHeight + 0.5;

    if (fits()) return;

    /* Busca binária encontra a maior escala que mantém todos os
       links dentro da parada, sem criar rolagem interna. */
    let low = 0.5;
    let high = 1;

    for (let i = 0; i < 12; i++) {

        const middle = (low + high) / 2;
        partners.style.fontSize = middle + "em";
        partners.style.gap = Math.max(2, 7 * middle) + "px";

        if (fits()) {
            low = middle;
        } else {
            high = middle;
        }

    }

    partners.style.fontSize = low + "em";
    partners.style.gap = Math.max(2, 7 * low) + "px";
}


function resizeNetworkStops() {

    if (!networkStops.length) return;

    /* getBoundingClientRect preserva frações de pixel; clientHeight
       arredonda o valor e podia deixar aparecer 1px do movimento seguinte. */
    networkStepHeight =
        networkViewport.getBoundingClientRect().height;

    if (!networkStepHeight) return;

    networkViewport.style.setProperty(
        "--network-step-height",
        networkStepHeight + "px"
    );

    networkStops.forEach(stop => {

        stop.style.flexBasis =
            networkStepHeight + "px";

        stop.style.height =
            networkStepHeight + "px";

        stop.style.maxHeight =
            networkStepHeight + "px";

    });

    fitNetworkPartnerships();
    applyNetworkPosition(false);
}

function initializeNetworkNavigation(preserveIndex = 0) {

    const networkContent =
        networkViewport.querySelector("#networkContent");

    if (!networkContent) {

        networkStops = [];
        networkCurrentIndex = 0;

        updateNetworkProgress();

        return;
    }

    /* Compatibilidade com as duas estruturas de Rede usadas no projeto:
       - duas seções (Núcleo Regular + Parcerias);
       - cinco paradas antigas (quatro integrantes + Parcerias).
       Em ambos os casos, a navegação final terá somente duas paradas. */
    const networkSections = Array.from(
        networkContent.querySelectorAll(":scope > .networkSection")
    );

    if (networkSections.length) {
        networkSections.forEach(section => {
            section.classList.add("networkStop");

        networkStops = networkSections;

    } else {
        const directStops = Array.from(
            networkContent.querySelectorAll(":scope > .networkStop")
        );

        if (directStops.length >= 5) {
            const coreStop = directStops[0];
            const peopleGrid = document.createElement("div");
            peopleGrid.className = "networkPeople";

            directStops.slice(0, 4).forEach(stop => {
                const person = stop.querySelector(".networkPerson");
                if (person) peopleGrid.appendChild(person);
            });

            coreStop.querySelectorAll(".networkCategory").forEach(title => {
                title.remove();
            });

            coreStop.appendChild(peopleGrid);
            coreStop.classList.add("networkCore");

            directStops.slice(1, 4).forEach(stop => stop.remove());

            networkStops = [coreStop, ...directStops.slice(4)];

        } else {
            networkStops = directStops;
            if (networkStops[0]) {
                networkStops[0].classList.add("networkCore");
            }
        }
    }

        networkCurrentIndex = Math.min(
    preserveIndex,
    Math.max(0, networkStops.length - 1)
);

networkAnimating = false;

    if (networkTransitionTimer !== null) {
        clearTimeout(networkTransitionTimer);
        networkTransitionTimer = null;
    }

    resizeNetworkStops();

    updateNetworkHeader();
    updateNetworkProgress();

}


/* OBSERVA MUDANÇAS NA ÁREA DISPONÍVEL DA REDE */

let networkViewportObserver = null;

if ("ResizeObserver" in window) {

    networkViewportObserver = new ResizeObserver(() => {

        if (!contentWindow.classList.contains("network")) return;
        if (!networkStops.length) return;

        resizeNetworkStops();

    });

    networkViewportObserver.observe(networkViewport);

}


/* FINALIZA A ANIMAÇÃO */

function finishNetworkTransition() {

    networkAnimating = false;

    if (networkTransitionTimer !== null) {
        clearTimeout(networkTransitionTimer);
        networkTransitionTimer = null;
    }
}


/* MUDA PARA UM MOVIMENTO */

function goToNetworkStep(index) {

    if (!isNetworkActive()) return;

    if (!networkStops.length) return;

    if (networkAnimating) return;

    const nextIndex = Math.max(
        0,
        Math.min(networkStops.length - 1, index)
    );

    if (nextIndex === networkCurrentIndex) return;

    /* ANIMA A TRANSFORMAÇÃO DO INDICADOR */

    animateNetworkArrow(nextIndex === 1);

    networkCurrentIndex = nextIndex;
    networkAnimating = true;

    applyNetworkPosition(true);

    networkTransitionTimer = setTimeout(() => {
        finishNetworkTransition();
    }, 600);
}


/* MOVIMENTO ANTERIOR E SEGUINTE */

function nextNetworkStep() {
    goToNetworkStep(networkCurrentIndex + 1);
}

function previousNetworkStep() {
    goToNetworkStep(networkCurrentIndex - 1);
}


/* CLIQUE NO TRIÂNGULO */

networkStepControl.addEventListener("click", () => {

    if (!isNetworkActive()) return;

    if (networkCurrentIndex === 0) {
        goToNetworkStep(1);
    } else {
        goToNetworkStep(0);
    }

});


/* =====================================================
   ROLAGEM GLOBAL — TODA A TELA
===================================================== */

document.addEventListener("wheel", event => {

    if (!isNetworkActive()) return;

    /* Elementos de interface que não devem acionar a Rede */
    const protectedArea = event.target.closest(
        "#header, #mainMenu, #siteControls, #emailContact, #networkStepControl"
    );

    if (protectedArea) return;

    event.preventDefault();

    if (networkAnimating) return;

    if (Math.abs(event.deltaY) < 12) return;

    if (event.deltaY > 0) {
        nextNetworkStep();
    } else {
        previousNetworkStep();
    }

}, { passive: false });


/* TOQUE — CELULAR */

networkViewport.addEventListener("touchstart", event => {

    if (!isNetworkActive()) return;

    if (event.touches.length !== 1) return;

    networkTouchStartY =
        event.touches[0].clientY;

}, { passive: true });


networkViewport.addEventListener("touchend", event => {

    if (!isNetworkActive()) return;

    if (networkTouchStartY === null) return;

    const touchEndY =
        event.changedTouches[0].clientY;

    const difference =
        networkTouchStartY - touchEndY;

    networkTouchStartY = null;

    if (Math.abs(difference) < 35) return;

    if (difference > 0) {
        nextNetworkStep();
    } else {
        previousNetworkStep();
    }

}, { passive: true });


networkViewport.addEventListener("touchcancel", () => {
    networkTouchStartY = null;
});

/* =====================================================
   TOQUE GLOBAL — FORA DA JANELA DA REDE
===================================================== */

let globalNetworkTouchStartY = null;
let globalNetworkTouchStartedOutside = false;

document.addEventListener("touchstart", event => {

    if (!isNetworkActive()) return;

    if (event.touches.length !== 1) return;

    const target = event.target;

    const protectedArea = target.closest(
        "#header, #mainMenu, #siteControls, #emailContact, #networkStepControl"
    );

    if (protectedArea) return;

    /* A janela da Rede já possui seu próprio controle de toque */
    if (target.closest("#contentWindow")) return;

    globalNetworkTouchStartedOutside = true;

    globalNetworkTouchStartY =
        event.touches[0].clientY;

}, { passive: true });


document.addEventListener("touchend", event => {

    if (!globalNetworkTouchStartedOutside) return;

    globalNetworkTouchStartedOutside = false;

    if (globalNetworkTouchStartY === null) return;

    const difference =
        globalNetworkTouchStartY -
        event.changedTouches[0].clientY;

    globalNetworkTouchStartY = null;

    if (Math.abs(difference) < 35) return;

    if (difference > 0) {
        nextNetworkStep();
    } else {
        previousNetworkStep();
    }

}, { passive: true });


document.addEventListener("touchcancel", () => {

    globalNetworkTouchStartY = null;
    globalNetworkTouchStartedOutside = false;

});

/* TECLADO */

document.addEventListener("keydown", event => {

    if (!isNetworkActive()) return;

    const activeElement =
        document.activeElement;

    if (
        activeElement &&
        (
            activeElement.closest("#networkContent a") ||
            activeElement.closest("#networkStepControl")
        )
    ) {
        return;
    }

    if (
        event.key === "ArrowDown" ||
        event.key === "PageDown"
    ) {
        event.preventDefault();
        nextNetworkStep();
    }

    if (
        event.key === "ArrowUp" ||
        event.key === "PageUp"
    ) {
        event.preventDefault();
        previousNetworkStep();
    }

    if (event.key === "Home") {
        event.preventDefault();
        goToNetworkStep(0);
    }

    if (event.key === "End") {
        event.preventDefault();
        goToNetworkStep(networkStops.length - 1);
    }

});


/* REDIMENSIONAMENTO DA JANELA */

let networkResizeTimer = null;

window.addEventListener("resize", () => {

    if (!contentWindow.classList.contains("network")) return;

    if (networkResizeTimer !== null) {
        clearTimeout(networkResizeTimer);
    }

    networkResizeTimer = setTimeout(() => {

        resizeNetworkStops();

        networkResizeTimer = null;

    }, 100);

});


/* =====================================================
   FECHAMENTO ANIMADO DO CONTEÚDO
===================================================== */

function closeContent(callback) {

    if (callback) {
        contentCloseCallbacks.push(callback);
    }

    if (contentCloseTimeout !== null) return;

    contentRequestId++;

    finishNetworkTransition();

    const isOpen =
        contentWindow.classList.contains("open");

    const isVisible =
        contentWindow.classList.contains("visible");

    if (!isOpen) {

        contentWindow.classList.remove(
            "open",
            "visible",
            "plain",
            "realization",
            "network",
            "loading"
        );

        contentWindow.dataset.section = "";
        contentText.textContent = "";

        networkStops = [];
        networkCurrentIndex = 0;

        updateNetworkProgress();

        const callbacks = contentCloseCallbacks.splice(0);
        callbacks.forEach(fn => fn());

        return;
    }

    contentWindow.classList.remove("visible");

    contentCloseTimeout = setTimeout(() => {

        contentWindow.classList.remove(
            "open",
            "plain",
            "realization",
            "network",
            "loading"
        );

        contentWindow.dataset.section = "";

        contentText.textContent = "";
        contentText.scrollTop = 0;

        networkStops = [];
        networkCurrentIndex = 0;

        updateNetworkProgress();

        contentCloseTimeout = null;

        const callbacks = contentCloseCallbacks.splice(0);
        callbacks.forEach(fn => fn());

    }, isVisible ? 600 : 0);

}


/* =====================================================
   PREPARA A ENTRADA DE UM NOVO CONTEÚDO
===================================================== */

function prepareContent(callback) {

    const transitionId = ++contentTransitionId;

    finishHomeAnimation(() => {

        if (transitionId !== contentTransitionId) return;

        closeContent(() => {

            if (transitionId !== contentTransitionId) return;

            callback();

        });

    });

}


/* =====================================================
   TROCA DE IDIOMA
===================================================== */

function changeLanguage(language) {

    if (!translations[language]) return;

    currentLanguage = language;

    localStorage.setItem(
        "rdct-language",
        currentLanguage
    );

    updateLanguageInterface();
    updateLogoTitle();

    const section = contentWindow.dataset.section || "";
    const previousNetworkIndex = networkCurrentIndex;

    if (section === "sobre" || section === "rede") {

        const requestId = ++contentRequestId;

        contentWindow.classList.add("loading");

        loadText(
            getContentPath(section),
            contentText,
            requestId
        ).finally(() => {

            if (requestId === contentRequestId) {
                contentWindow.classList.remove("loading");

                if (section === "rede") {
    initializeNetworkNavigation(previousNetworkIndex);
}

            }

        });

    } else if (section.startsWith("realizacao-")) {

        const number = section.replace("realizacao-", "");

        contentText.textContent =
            translations[currentLanguage].realization +
            " " + number + ".";

    }

}


/* LANGUAGE BUTTONS */

document.querySelectorAll(
    "[data-language]"
).forEach(button => {

    button.addEventListener("click", () => {
        changeLanguage(button.dataset.language);
    });

});


/* RESTORE LANGUAGE */

if (!translations[currentLanguage]) {
    currentLanguage = "pt";
}

updateLanguageInterface();
updateLogoTitle();


/* RESTORE PREFERENCES */

updateFontSize();
updateTheme();


/* =====================================================
   LOAD TEXT
===================================================== */

async function loadText(path, target, requestId) {

    try {

        const response = await fetch(path);

        if (!response.ok) {
            throw new Error("Não foi possível carregar " + path);
        }

        const text = await response.text();

        if (requestId !== contentRequestId) {
            return;
        }

        target.innerHTML = text.trim();

        target.scrollTop = 0;

        if (
            target.id === "contentText" &&
            contentWindow.classList.contains("network") &&
            !contentWindow.classList.contains("loading")
        ) {
            initializeNetworkNavigation();
        }

    } catch (error) {

        if (requestId !== contentRequestId) {
            return;
        }

        console.error(error);

        target.textContent =
            translations[currentLanguage].error;
    }

}


/* =====================================================
   ENTRADA VISUAL DO CONTEÚDO
===================================================== */

function revealContent() {

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {
            contentWindow.classList.add("visible");
        });

    });
}


/* =====================================================
   OPEN CONTENT
===================================================== */

function openPlainContent(section, path) {

    prepareContent(() => {

        const requestId = ++contentRequestId;

        contentWindow.classList.remove("realization");

        contentWindow.classList.add("plain");

        contentWindow.classList.toggle(
            "network",
            section === "rede"
        );

        contentWindow.classList.add("loading");
        contentWindow.classList.add("open");

        contentWindow.dataset.section = section;

        contentText.scrollTop = 0;
        contentText.textContent = "";

        networkStops = [];
        networkCurrentIndex = 0;

        updateNetworkProgress();

        revealContent();

        loadText(path, contentText, requestId)
            .finally(() => {

                if (requestId === contentRequestId) {

                    contentWindow.classList.remove("loading");

                    if (section === "rede") {
                        initializeNetworkNavigation();
                    }

                }

            });

    });

}


/* =====================================================
   OPEN REALIZATION
===================================================== */

function openRealization(number) {

    prepareContent(() => {

        contentRequestId++;

        contentWindow.classList.remove(
            "plain",
            "network",
            "loading"
        );

        contentWindow.classList.add("realization");
        contentWindow.classList.add("open");

        contentWindow.dataset.section =
            "realizacao-" + number;

        contentText.scrollTop = 0;

        contentText.textContent =
            translations[currentLanguage].realization +
            " " + number + ".";

        revealContent();

    });

}


/* =====================================================
   LOGO — RETORNAR À HOME
===================================================== */

headerImage.addEventListener("click", () => {

    ++contentTransitionId;

    realizationsDropdown.classList.remove("open");

    closeContent(() => {
        startHomeAnimation();
    });

});


/* =====================================================
   ABOUT AND NETWORK
===================================================== */

menuItems.forEach(item => {

    item.addEventListener("click", () => {

        const section = item.dataset.content;

        realizationsDropdown.classList.remove("open");

        openPlainContent(
            section,
            getContentPath(section)
        );

    });

});


/* =====================================================
   REALIZATIONS DROPDOWN
===================================================== */

realizationsToggle.addEventListener("click", () => {

    const shouldOpen =
        !realizationsDropdown.classList.contains("open");

    realizationsDropdown.classList.toggle(
        "open",
        shouldOpen
    );

});


/* =====================================================
   REALIZATION WINDOWS
===================================================== */

realizationItems.forEach(item => {

    item.addEventListener("click", () => {

        const number = item.dataset.realization;

        realizationsDropdown.classList.remove("open");

        openRealization(number);

    });

});


/* =====================================================
   CLOSE WHEN CLICKING OUTSIDE
===================================================== */

document.addEventListener("pointerdown", event => {

    const isContentOpen =
        contentWindow.classList.contains("open");

    if (!isContentOpen) return;

    if (contentWindow.contains(event.target)) return;

    if (event.target.closest("#siteControls")) return;

    if (event.target.closest("#header")) return;

    if (event.target.closest("#mainMenu")) return;

    closeContent(() => {
        startHomeAnimation();
    });

});


/* =====================================================
   CLOSE WITH ESCAPE
===================================================== */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        const isContentOpen =
            contentWindow.classList.contains("open");

        if (isContentOpen) {

            closeContent(() => {
                startHomeAnimation();
            });

        }

        realizationsDropdown.classList.remove("open");

    }

});


/* =====================================================
   PULL TO REFRESH — MOBILE
===================================================== */

if (window.matchMedia("(max-width: 600px)").matches) {

    const pullIndicator =
        document.getElementById("pullIndicator");

    let touchStartY = 0;
    let pullDistance = 0;
    let pulling = false;

    const pullThreshold = 90;
    const pullMaximum = 120;


    document.addEventListener("touchstart", event => {

    if (isNetworkActive()) return;

    if (event.touches.length !== 1) return;

        if (
            event.target.closest(
                "#mainMenu, #contentWindow, #emailContact, #siteControls, a, button"
            )
        ) {
            return;
        }

        touchStartY = event.touches[0].clientY;
        pullDistance = 0;
        pulling = true;

    }, { passive: true });


    document.addEventListener("touchmove", event => {

        if (!pulling) return;

        const currentY = event.touches[0].clientY;
        const distance = currentY - touchStartY;

        if (distance > 0) {

            pullDistance = Math.min(distance, pullMaximum);

            if (pullDistance > 10) {

                event.preventDefault();

                pullIndicator.classList.add("visible");

                pullIndicator.style.top =
                    (12 + pullDistance * 0.45) + "px";

                pullIndicator.textContent =
                    pullDistance >= pullThreshold
                    ? "Solte para atualizar"
                    : "Puxe para atualizar";
            }
        }

    }, { passive: false });


    document.addEventListener("touchend", () => {

        if (!pulling) return;

        if (pullDistance >= pullThreshold) {

            pullIndicator.textContent = "Atualizando...";

            window.location.reload();

        } else {

            pullIndicator.classList.remove("visible");
            pullIndicator.style.top = "12px";
        }

        pulling = false;
        pullDistance = 0;

    });


    document.addEventListener("touchcancel", () => {

        pulling = false;
        pullDistance = 0;

        pullIndicator.classList.remove("visible");
        pullIndicator.style.top = "12px";

    });

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

runOpeningScene();

</script>
