async function loadRealizationCatalog() {

    if (realizationCatalogPromise) return realizationCatalogPromise;

    realizationCatalogPromise = fetch(
        "ativos/realizacoes/catalogo.json",
        { cache: "no-store" }
    )
        .then(response => {
            if (!response.ok) {
                throw new Error("Catálogo de realizações não encontrado.");
            }
            return response.json();
        })
        .then(data => {
            realizationCatalog = Array.isArray(data.realizations)
                ? data.realizations
                : [];
            renderRealizationMenu();
            return realizationCatalog;
        })
        .catch(error => {
            console.warn(error);
            realizationCatalog = [];
            renderRealizationMenu();
            return [];
        });

    return realizationCatalogPromise;

}


/* =====================================================
   FORMATAÇÃO DE PARÁGRAFOS
===================================================== */

function appendParagraphs(container, text) {

    if (!text) return;

    const normalizedText = String(text)
        .replace(/\\n/g, "\n")
        .replace(/\r\n?/g, "\n")
        .trim();

    if (!normalizedText) return;

    /* Se já existem parágrafos HTML, preserva a estrutura */
    if (/<p[\s>]/i.test(normalizedText)) {
        container.innerHTML = normalizedText;
        return;
    }

    /* Separa os blocos por linhas em branco */
    normalizedText
        .split(/\n\s*\n/)
        .map(paragraph => paragraph.trim())
        .filter(Boolean)
        .forEach(paragraph => {

            const p = document.createElement("p");

            /* Preserva marcações como <strong> */
            p.innerHTML = paragraph.replace(/\n/g, "<br>");

            container.appendChild(p);

        });

}

function appendMetadata(container, metadata) {

    const data = localizedValue(metadata);
    if (!data || typeof data !== "object") return;

    const meta = document.createElement("div");
    meta.className = "realizationMeta";

    registerLanguageUpdater(meta, () => {

        const currentData = localizedValue(metadata) || {};

        meta.replaceChildren();

        if (currentData.title) {
            const title = document.createElement("div");
            title.className = "realizationMetaTitle";
            title.textContent = currentData.title;
            meta.appendChild(title);
        }

        if (currentData.description) {
            const description = document.createElement("div");
            description.className = "realizationMetaDescription";
            description.textContent = currentData.description;
            meta.appendChild(description);
        }

        if (currentData.credit) {
            const credit = document.createElement("div");
            credit.className = "realizationMetaCredit";

            const label = document.createElement("span");
            label.className = "realizationMetaLabel";
            label.textContent = translations[currentLanguage].credit + ": ";

            credit.append(label, document.createTextNode(currentData.credit));
            meta.appendChild(credit);
        }

        if (currentData.source) {
            const source = document.createElement("div");
            source.className = "realizationMetaSource";

            const label = document.createElement("span");
            label.className = "realizationMetaLabel";
            label.textContent = translations[currentLanguage].source + ": ";

            source.append(label, document.createTextNode(currentData.source));
            meta.appendChild(source);
        }

    });

    if (meta.childNodes.length) {
        container.appendChild(meta);
    }

}


function normalizeEmbedUrl(rawUrl, mediaType) {

    try {
        const url = new URL(String(rawUrl).trim());
        if (!["https:", "http:"].includes(url.protocol)) return null;

        const host = url.hostname.toLowerCase().replace(/^www\./, "");
        const parts = url.pathname.split("/").filter(Boolean);

        if (mediaType === "text") {
            return url.protocol === "https:" ? url.href : null;
        }

        if (mediaType === "video" && (host === "youtube.com" || host === "m.youtube.com" || host === "youtu.be" || host === "youtube-nocookie.com")) {
            let id = "";
            if (host === "youtu.be") id = parts[0] || "";
            else if (url.searchParams.get("v")) id = url.searchParams.get("v");
            else if (["embed", "shorts", "live"].includes(parts[0])) id = parts[1] || "";
            if (!id && host === "youtube-nocookie.com" && parts[0] === "embed") id = parts[1] || "";
            return id ? "https://www.youtube.com/embed/" + encodeURIComponent(id) : null;
        }

        if (mediaType === "video" && (host === "vimeo.com" || host === "player.vimeo.com")) {
            const id = host === "player.vimeo.com" ? parts[1] : parts[0];
            return id && /^\d+$/.test(id) ? "https://player.vimeo.com/video/" + id : null;
        }

        if (mediaType === "audio" && (host === "open.spotify.com" || host === "spotify.com")) {
            if (parts[0] === "embed") return url.href;
            const index = parts.findIndex(part => ["track", "album", "playlist", "episode", "show"].includes(part));
            if (index >= 0 && parts[index + 1]) {
                return "https://open.spotify.com/embed/" + parts[index] + "/" + encodeURIComponent(parts[index + 1]);
            }
            return null;
        }

        if (mediaType === "audio" && (host === "deezer.com" || host === "widget.deezer.com")) {
            if (host === "widget.deezer.com" && url.pathname.includes("/widget/")) return url.href;
            const index = parts.findIndex(part => ["track", "album", "playlist", "episode"].includes(part));
            if (index >= 0 && parts[index + 1]) {
                return "https://widget.deezer.com/widget/dark/" + parts[index] + "/" + encodeURIComponent(parts[index + 1]);
            }
            return null;
        }

        if (mediaType === "audio" && (host === "soundcloud.com" || host === "w.soundcloud.com")) {
            if (host === "w.soundcloud.com" && url.pathname.includes("/player")) return url.href;
            return "https://w.soundcloud.com/player/?url=" + encodeURIComponent(url.href) + "&auto_play=false&hide_related=true&show_comments=true";
        }

        if (mediaType === "instagram" && (host === "instagram.com" || host === "instagr.am")) {
            const kindIndex = parts.findIndex(part => ["p", "reel", "tv"].includes(part));
            if (kindIndex >= 0 && parts[kindIndex + 1]) {
                return "https://www.instagram.com/" + parts[kindIndex] + "/" + encodeURIComponent(parts[kindIndex + 1]) + "/embed/";
            }
            return null;
        }

    } catch (error) {
        console.warn("Endereço de incorporação inválido:", rawUrl);
    }

    return null;

}


function createEmbed(item, mediaType) {

    const src = normalizeEmbedUrl(item.embed_url, mediaType);

    if (!src) {

        const warning = document.createElement("p");
        warning.className = "realizationEmpty";

        registerLanguageUpdater(warning, () => {
            warning.textContent = translations[currentLanguage].embedError;
        });

        return warning;
    }

    const frame = document.createElement("iframe");

    frame.src = src;
    frame.loading = "lazy";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "strict-origin-when-cross-origin";

    if (mediaType === "text") {

        frame.className = "realizationEmbedFrame textEmbed";

    } else if (mediaType === "instagram") {

        frame.className = "realizationEmbedFrame instagramEmbed";
        frame.setAttribute(
            "allow",
            "autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
        );

    } else if (mediaType === "audio") {

        frame.className = "realizationEmbedFrame audioEmbed";

        if (src.includes("deezer.com/widget/")) {
            frame.classList.add("deezerEmbed");
        }

        if (src.includes("spotify.com/embed/")) {
            frame.classList.add("spotifyEmbed");
        }

        frame.setAttribute(
            "allow",
            "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        );

    } else {

        frame.className = "realizationVideoFrame";

        frame.setAttribute(
            "allow",
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        );

    }

    registerLanguageUpdater(frame, () => {

        const title =
            localizedValue(item.metadata)?.title ||
            translations[currentLanguage].embeddedContent;

        frame.title = title;
        frame.setAttribute("title", title);

    });

    return frame;

}


function createMediaItem(item, mediaType) {

    const wrapper = document.createElement("div");
    wrapper.className = "realizationMediaItem";

    if (item.kind === "embed") {
        wrapper.appendChild(createEmbed(item, mediaType));
    } else if (mediaType === "video") {
        const video = document.createElement("video");
        video.className = "realizationVideo";
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        const source = document.createElement("source");
        source.src = item.path;
        source.type = item.mime || "video/mp4";
        video.appendChild(source);
        wrapper.appendChild(video);
    } else if (mediaType === "audio") {
        const audio = document.createElement("audio");
        audio.className = "realizationAudio";
        audio.controls = true;
        audio.preload = "metadata";
        const source = document.createElement("source");
        source.src = item.path;
        source.type = item.mime || "audio/mpeg";
        audio.appendChild(source);
        wrapper.appendChild(audio);
    }

    appendMetadata(wrapper, item.metadata);
    return wrapper;

}


function updateGalleryArrows(track, previous, next) {

    previous.hidden = track.scrollLeft <= 2;
    next.hidden = track.scrollLeft + track.clientWidth >= track.scrollWidth - 2;

}


function createGallery(items) {

    const gallery = document.createElement("div");
    gallery.className = "realizationGallery";

    const previous = document.createElement("button");
    previous.type = "button";
    previous.className = "realizationGalleryArrow previous";
    previous.textContent = "‹";
registerLanguageUpdater(previous, () => {
    previous.setAttribute(
        "aria-label",
        translations[currentLanguage].previousImage
    );
});
    const next = document.createElement("button");
    next.type = "button";
    next.className = "realizationGalleryArrow next";
    next.textContent = "›";
registerLanguageUpdater(next, () => {
    next.setAttribute(
        "aria-label",
        translations[currentLanguage].nextImage
    );
});
    const track = document.createElement("div");
    track.className = "realizationGalleryTrack";

    items.forEach(item => {
        const figure = document.createElement("figure");
        figure.className = "realizationGalleryItem";
        const image = document.createElement("img");
        image.src = item.path;
        image.loading = "lazy";
        const meta = localizedValue(item.metadata) || {};
registerLanguageUpdater(image, () => {

    const currentMeta = localizedValue(item.metadata) || {};

    image.alt = currentMeta.title || currentMeta.description || "";

});        figure.appendChild(image);
        appendMetadata(figure, item.metadata);
        track.appendChild(figure);
    });

    previous.addEventListener("click", () => {
        track.scrollBy({ left: -track.clientWidth * 0.8, behavior: "smooth" });
    });
    next.addEventListener("click", () => {
        track.scrollBy({ left: track.clientWidth * 0.8, behavior: "smooth" });
    });
    track.addEventListener("scroll", () => updateGalleryArrows(track, previous, next));
    window.addEventListener("resize", () => updateGalleryArrows(track, previous, next));
    track.addEventListener("load", () => updateGalleryArrows(track, previous, next), true);

    gallery.append(previous, track, next);
    requestAnimationFrame(() => updateGalleryArrows(track, previous, next));
    return gallery;

}


function renderActiveRealization(resetScroll = true) {

    const realization = realizationCatalog.find(
        item => item.slug === activeRealizationSlug
    );

    if (!realization) return;

    const previousScroll = contentText.scrollTop;

    const page = document.createElement("div");
    page.className = "realizationPage";

    const sections = Array.isArray(realization.sections)
        ? realization.sections
        : [];

    sections.forEach(section => {

        if (section.type === "presentation") {

            const data = localizedValue(section.content) || {};

            const block = document.createElement("section");
            block.className = "realizationBlock realizationPresentation";

            if (data.title) {

                const title = document.createElement("h1");

                registerLanguageUpdater(title, () => {

                    const currentData = localizedValue(section.content) || {};
                    const currentTitle = currentData.title || "";

                    title.replaceChildren();

                    const match = String(currentTitle).match(
                        /^(.*?)(?:\s*[\(\[](\d{4}(?:[-_]\d{2,4})?)[\)\]])$/
                    );

                    if (match) {

                        const name = document.createElement("strong");
                        name.textContent = match[1].trim();

                        const year = document.createElement("span");
                        year.className = "realizationYear";
                        year.textContent = ` [${match[2]}]`;

                        title.append(name, year);

                    } else {

                        title.textContent = currentTitle;

                    }

                });

                block.appendChild(title);

            }

            if (data.description) {

                const description = document.createElement("div");
                description.className = "realizationDescription";

                registerLanguageUpdater(description, () => {

                    description.replaceChildren();

                    const currentData = localizedValue(section.content) || {};

                    appendParagraphs(
                        description,
                        currentData.description
                    );

                });

                block.appendChild(description);

            }

            page.appendChild(block);
            return;

        }

        if (section.type === "credits") {

            const text = localizedValue(section.content);
            if (!text) return;

            const block = document.createElement("section");
            block.className = "realizationBlock realizationCredits";

            registerLanguageUpdater(block, () => {

                block.replaceChildren();

                appendParagraphs(
                    block,
                    localizedValue(section.content)
                );

            });

            page.appendChild(block);
            return;

        }

        const items = Array.isArray(section.items)
            ? section.items
            : [];

        if (!items.length) return;

        const block = document.createElement("section");

        block.className =
            "realizationBlock realizationSection realization-" +
            section.type;

        if (section.type === "gallery") {

            block.appendChild(createGallery(items));

        } else if (
            section.type === "video" ||
            section.type === "audio" ||
            section.type === "instagram"
        ) {

            items.forEach(item => {
                block.appendChild(createMediaItem(item, section.type));
            });

        } else if (section.type === "text") {

            items.forEach(item => {

                if (item.kind === "embed") {

                    const embedItem = document.createElement("div");
                    embedItem.className = "realizationMediaItem";

                    embedItem.appendChild(createEmbed(item, "text"));

                    appendMetadata(embedItem, item.metadata);

                    block.appendChild(embedItem);
                    return;

                }

                const text = localizedValue(item.content);
                if (!text) return;

                const textItem = document.createElement("article");
                textItem.className = "realizationTextItem";

                registerLanguageUpdater(textItem, () => {

                    Array.from(textItem.children).forEach(child => {

                        if (!child.classList.contains("realizationMeta")) {
                            child.remove();
                        }

                    });

                    appendParagraphs(
                        textItem,
                        localizedValue(item.content)
                    );

                });

                appendMetadata(textItem, item.metadata);

                block.appendChild(textItem);

            });

        }

        if (block.childNodes.length) {
            page.appendChild(block);
        }

    });

    if (!page.childNodes.length) {

        const empty = document.createElement("p");
        empty.className = "realizationEmpty";

        registerLanguageUpdater(empty, () => {
            empty.textContent = translations[currentLanguage].emptyRealization;
        });

        page.appendChild(empty);

    }

    contentText.replaceChildren(page);

    contentText.scrollTop = resetScroll ? 0 : previousScroll;

    requestAnimationFrame(updateRealizationScrollbar);

}

/* =====================================================
   BARRA EXTERNA — REALIZAÇÕES
===================================================== */

const realizationScrollbar =
    document.getElementById("realizationScrollbar");

const realizationScrollbarThumb =
    document.getElementById("realizationScrollbarThumb");

let realizationScrollbarDragging = false;


function updateRealizationScrollbar() {

    const isActive =
        contentWindow.classList.contains("open") &&
        contentWindow.classList.contains("realization");

    if (!isActive) {
        realizationScrollbar.classList.remove("visible");
        return;
    }

    const viewportHeight = contentText.clientHeight;
    const contentHeight = contentText.scrollHeight;

    if (
        !viewportHeight ||
        contentHeight <= viewportHeight + 1
    ) {
        realizationScrollbar.classList.remove("visible");
        return;
    }

    const rect = contentText.getBoundingClientRect();

    realizationScrollbar.style.top = rect.top + "px";
    realizationScrollbar.style.height = rect.height + "px";

    const ratio = viewportHeight / contentHeight;

    const thumbHeight = Math.max(
        24,
        rect.height * ratio
    );

    realizationScrollbarThumb.style.height =
        Math.min(thumbHeight, rect.height) + "px";

    const maxThumbTop =
        rect.height - Math.min(thumbHeight, rect.height);

    const maxScroll =
        contentHeight - viewportHeight;

    const thumbTop =
        maxScroll > 0
            ? (contentText.scrollTop / maxScroll) * maxThumbTop
            : 0;

    realizationScrollbarThumb.style.top =
        thumbTop + "px";

    const percentage = Math.round(
        (contentText.scrollTop / maxScroll) * 1000
    );

    realizationScrollbar.setAttribute("aria-valuemin", "0");
    realizationScrollbar.setAttribute("aria-valuemax", "1000");
    realizationScrollbar.setAttribute(
        "aria-valuenow",
        String(percentage)
    );

    realizationScrollbar.classList.add("visible");

}


/* SINCRONIZA A BARRA COM A ROLAGEM */

contentText.addEventListener(
    "scroll",
    updateRealizationScrollbar
);


/* POSICIONA A ROLAGEM A PARTIR DO CLIQUE OU ARRASTE */

function scrollRealizationFromPointer(clientY) {

    const rect = realizationScrollbar.getBoundingClientRect();

    const thumbHeight =
        realizationScrollbarThumb.offsetHeight;

    const maxThumbTop =
        rect.height - thumbHeight;

    const maxScroll =
        contentText.scrollHeight - contentText.clientHeight;

    if (maxThumbTop <= 0 || maxScroll <= 0) return;

    const thumbTop = Math.max(
        0,
        Math.min(
            maxThumbTop,
            clientY - rect.top - thumbHeight / 2
        )
    );

    contentText.scrollTop =
        (thumbTop / maxThumbTop) * maxScroll;

    updateRealizationScrollbar();

}


/* CLIQUE E INÍCIO DO ARRASTE */

realizationScrollbar.addEventListener("pointerdown", event => {

    if (!contentWindow.classList.contains("realization")) return;

    event.preventDefault();

    realizationScrollbarDragging = true;

    realizationScrollbar.classList.add("dragging");

    realizationScrollbar.setPointerCapture(event.pointerId);

    scrollRealizationFromPointer(event.clientY);

});


/* MOVIMENTO DO INDICADOR */

realizationScrollbar.addEventListener("pointermove", event => {

    if (!realizationScrollbarDragging) return;

    scrollRealizationFromPointer(event.clientY);

});


/* FINALIZA O ARRASTE */

function finishRealizationScrollbarDrag() {

    realizationScrollbarDragging = false;

    realizationScrollbar.classList.remove("dragging");

}

realizationScrollbar.addEventListener(
    "pointerup",
    finishRealizationScrollbarDrag
);

realizationScrollbar.addEventListener(
    "pointercancel",
    finishRealizationScrollbarDrag
);

realizationScrollbar.addEventListener(
    "lostpointercapture",
    finishRealizationScrollbarDrag
);


/* CONTROLE PELO TECLADO */

realizationScrollbar.addEventListener("keydown", event => {

    if (!contentWindow.classList.contains("realization")) return;

    const step = contentText.clientHeight * 0.15;

    if (event.key === "ArrowDown") {
        event.preventDefault();
        contentText.scrollTop += step;
    }

    if (event.key === "ArrowUp") {
        event.preventDefault();
        contentText.scrollTop -= step;
    }

    if (event.key === "PageDown") {
        event.preventDefault();
        contentText.scrollTop += contentText.clientHeight;
    }

    if (event.key === "PageUp") {
        event.preventDefault();
        contentText.scrollTop -= contentText.clientHeight;
    }

    if (event.key === "Home") {
        event.preventDefault();
        contentText.scrollTop = 0;
    }

    if (event.key === "End") {
        event.preventDefault();
        contentText.scrollTop = contentText.scrollHeight;
    }

});


/* ATUALIZAÇÃO APÓS REDIMENSIONAMENTO */

window.addEventListener("resize", () => {

    requestAnimationFrame(updateRealizationScrollbar);

});


/* ATUALIZAÇÃO APÓS CARREGAMENTO DE MÍDIA */

contentText.addEventListener(
    "load",
    updateRealizationScrollbar,
    true
);
/* =====================================================
   OPEN REALIZATION — TROCA ANIMADA DE CONTEÚDO
===================================================== */

function openRealization(slug) {

    const realization = realizationCatalog.find(
        item => item.slug === slug
    );

    if (!realization) return;

    /* =================================================
       CELULAR — SEM DROPDOWN
    ================================================= */

    if (isMobileRealizations()) {

        ++contentTransitionId;
        contentRequestId++;

        finishNetworkTransition();

        setRealizationsDropdown(false);

        activeRealizationSlug = slug;

        contentWindow.classList.remove(
            "plain",
            "network",
            "realizationCatalog",
            "loading"
        );

        contentWindow.classList.add(
            "realization",
            "open",
            "visible"
        );

        contentWindow.dataset.section = "realizacao-" + slug;
        contentWindow.dataset.realizationSlug = slug;

        contentWindow.style.removeProperty("--content-fit-scale");

        contentText.replaceChildren();
        contentText.scrollTop = 0;

        renderActiveRealization(true);

        contentWindow.classList.remove("loading");

        requestAnimationFrame(updateRealizationScrollbar);

        return;
    }

    /* =================================================
       DESKTOP — FADE-OUT ANTES DA TROCA
    ================================================= */

    contentRequestId++;

    finishNetworkTransition();

    transitionRealizationView(() => {

        activeRealizationSlug = slug;

        contentWindow.classList.remove(
            "plain",
            "network",
            "realizationCatalog",
            "loading"
        );

        contentWindow.classList.add(
            "realization",
            "open"
        );

        contentWindow.dataset.section = "realizacao-" + slug;
        contentWindow.dataset.realizationSlug = slug;

        contentWindow.style.removeProperty("--content-fit-scale");

        contentText.replaceChildren();
        contentText.scrollTop = 0;

        /* Mantém o dropdown aberto no desktop */
        setRealizationsDropdown(true);

        renderActiveRealization(true);

        contentWindow.classList.remove("loading");

        revealContent();

        requestAnimationFrame(updateRealizationScrollbar);

    });

}


/* =====================================================
   LOGO — RETORNAR À HOME
===================================================== */

headerImage.addEventListener("click", () => {

    ++contentTransitionId;

    closeContent(() => {
        startHomeAnimation();
    });

});


/* =====================================================
   ABOUT AND NETWORK
===================================================== */

menuItems.forEach(item => {

    item.addEventListener("click", () => {

        const section = item.dataset.content;

        openPlainContent(
            section,
            getContentPath(section)
        );

    });

});


/* =====================================================
   REALIZAÇÕES — ALTERNÂNCIA ENTRE GALERIA E DROPDOWN
===================================================== */

realizationsToggle.addEventListener("click", () => {

    const isMobile = isMobileRealizations();

    const dropdown = document.getElementById("realizationsDropdown");

    const dropdownIsOpen =
        dropdown && dropdown.classList.contains("open");

    const realizationIsOpen =
        contentWindow.classList.contains("open") &&
        contentWindow.classList.contains("realization");

    const catalogIsOpen =
        contentWindow.classList.contains("open") &&
        contentWindow.classList.contains("realizationCatalog");


    /* =================================================
       CELULAR — GALERIA E PÁGINA, SEM DROPDOWN
    ================================================= */

    if (isMobile) {

        if (realizationIsOpen) {
            showRealizationCatalog();
            return;
        }

        if (catalogIsOpen) {
            return;
        }

        openRealizationCatalog();

        return;
    }


    /* =================================================
       DESKTOP — DROPDOWN ABERTO
    ================================================= */

    if (dropdownIsOpen) {

        showRealizationCatalog();

        return;
    }


    /* =================================================
       DESKTOP — REALIZAÇÃO ABERTA
    ================================================= */

    if (realizationIsOpen) {

        setRealizationsDropdown(true);

        return;
    }


    /* =================================================
       DESKTOP — GALERIA JÁ ABERTA
    ================================================= */

    if (catalogIsOpen) {
        return;
    }


    /* =================================================
       DESKTOP — NENHUM CONTEÚDO ABERTO
    ================================================= */

    openRealizationCatalog();

});


/* =====================================================
   CLOSE WITH ESCAPE
===================================================== */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        const isContentOpen =
            contentWindow.classList.contains("open");

        if (isContentOpen) {

            closeContent(() => {
                startHomeAnimation();
            });

        }


    }

});


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

loadRealizationCatalog();
runOpeningScene();


</script>
