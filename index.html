<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rdct</title>

<style>
/* =====================================================
   RESET E VARIÁVEIS
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --page-bg: #F5F5F5;
    --page-fg: #1A1A1A;
    --page-hover: #888888;
    --panel-bg: #F5F5F5;
    --panel-border: #cccccc;
    --photo-overlay: rgba(245,245,245,0.55);
    --font-scale: 1;
}

body.dark-mode {
    --page-bg: #1A1A1A;
    --page-fg: #F5F5F5;
    --page-hover: #888888;
    --panel-bg: #1A1A1A;
    --panel-border: #555555;
    --photo-overlay: rgba(26,26,26,0.55);
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: var(--page-bg);
    color: var(--page-fg);
    font-family: sans-serif;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.2s ease, color 0.2s ease;
}

/* =====================================================
   TYPOGRAPHY
===================================================== */

@font-face {
    font-family: "MyFont";
    src: url("https://redesencontros.github.io/rdctsite/ativos/fontes/jost.woff2") format("woff2");
    font-weight: 370;
    font-style: normal;
}

/* =====================================================
   BOIDS BACKGROUND
===================================================== */

#background {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: var(--page-bg);
    opacity: 1;
    transition: opacity 0.6s ease;
}

#canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* =====================================================
   CENA DE ABERTURA
===================================================== */

#openingScene {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page-bg);
    opacity: 1;
    visibility: visible;
    pointer-events: none;
}

#openingLogo {
    display: block;
    width: clamp(60px, 27vw, 105px);
    height: auto;
    opacity: 0;
    transform: scale(1.2);
    transform-origin: center;
    will-change: transform, opacity;
}

#openingScene.playing #openingLogo {
    animation: openingSequence 3.2s linear forwards;
}

@keyframes openingSequence {
    0% {
        opacity: 0;
        transform: scale(1.2);
    }

    18.75% {
        opacity: 1;
        transform: scale(1.25625);
    }

    81.25% {
        opacity: 1;
        transform: scale(1.44375);
    }

    100% {
        opacity: 0;
        transform: scale(1.5);
    }
}

body.intro-active #background,
body.intro-active #header,
body.intro-active #mainMenu,
body.intro-active #homeAnimation,
body.intro-active #siteControls,
body.intro-active #emailContact {
    opacity: 0;
    pointer-events: none;
}

/* =====================================================
   HOME — ANIMAÇÃO DE PALAVRAS
===================================================== */

#homeAnimation {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 90vw;
    text-align: center;
    font-family: MyFont, sans-serif;
    font-weight: 370;
    font-size: calc(16px * var(--font-scale));
    line-height: 1.4;
    color: var(--page-fg);
    pointer-events: none;
    opacity: 0;
    visibility: visible;
    transition: opacity 0.6s ease;
}

#homeAnimation.visible {
    opacity: 1;
}

#homeAnimation.hidden {
    opacity: 0;
    visibility: hidden;
}

#homeWord {
    display: block;
    width: 100%;
    text-align: center;
    overflow-wrap: anywhere;
}

/* =====================================================
   LOGO DO CABEÇALHO
===================================================== */

#header {
    position: fixed;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 45;
    pointer-events: auto;
    cursor: pointer;
    transition: opacity 0.6s ease;
}

#header img {
    display: block;
    width: clamp(30px, 18vw, 70px);
    height: auto;
    cursor: pointer;
}

/* =====================================================
   TYPOGRAPHY SHARED
===================================================== */

#mainMenu,
#emailContact,
#contentWindow,
#siteControls {
    font-family: MyFont, sans-serif;
    font-weight: 370;
    color: var(--page-fg);
}

/* =====================================================
   MAIN MENU
===================================================== */

#mainMenu {
    position: fixed;
    top: 5vh;
    left: 30px;
    transform: none;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    font-size: calc(16px * var(--font-scale));
    line-height: 1.4;
    transition: opacity 0.6s ease;
}

.menuItem {
    position: relative;
    color: var(--page-fg);
    white-space: nowrap;
    cursor: pointer;
    text-transform: none;
    transition: color 0.2s ease;
}

.menuItem:hover {
    color: var(--page-hover);
}

/* =====================================================
   REALIZATIONS DROPDOWN
===================================================== */

#realizationsDropdown {
    display: none;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    margin-top: 5px;
    margin-left: 15px;
}

#realizationsDropdown.open {
    display: flex;
}

.realizationItem {
    color: var(--page-fg);
    white-space: nowrap;
    cursor: pointer;
    transition: color 0.2s ease;
}

.realizationItem:hover {
    color: var(--page-hover);
}

/* =====================================================
   CONTENT WINDOW
   CONTÊINER EXTERNO — SEM ROLAGEM E SEM PADDING
===================================================== */

#contentWindow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;

    width: 100vw;
    max-height: 70vh;

    overflow: hidden;

    font-size: calc(clamp(13px, 1.1vw, 17px) * var(--font-scale));
    line-height: 1.5;
    text-align: left;
    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.6s ease,
        visibility 0s linear 0.6s;

    pointer-events: none;
}

#contentWindow.open {
    visibility: visible;
    transition:
        opacity 0.6s ease,
        visibility 0s;
}

#contentWindow.open.visible {
    opacity: 1;
    pointer-events: auto;
}

#contentWindow.open:not(.network) {
    display: block;
}

#contentWindow.plain {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-radius: 0;
}

#contentWindow.realization {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border-radius: 0;
}

/* =====================================================
   CONTENT TEXT
   CONTÊINER INTERNO — ROLAGEM NA EXTREMA DIREITA
===================================================== */

#contentText {
    width: 100%;
    min-width: 0;
    max-height: 70vh;

    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;

    padding: 40px max(40px, calc((100vw - 800px) / 2));

    white-space: pre-line;
    color: var(--page-fg);
    overflow-wrap: anywhere;
}

#contentText p {
    margin-top: 0;
    margin-bottom: 1em;
}

/* =====================================================
   INDICADOR DE CARREGAMENTO
===================================================== */

#contentWindow.open.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: min(70vh, 500px);
    max-height: 70vh;
    overflow: hidden;
    text-align: center;
}

#contentWindow.open.loading #contentText {
    display: none;
}

#contentWindow.open.loading::after {
    content: "";
    display: block;
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    border: 2px solid var(--panel-border);
    border-top-color: var(--page-fg);
    border-radius: 50%;
    animation: loadingSpin 0.8s linear infinite;
}

@keyframes loadingSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* =====================================================
   REDE
   CONTÊINER EXTERNO — LARGURA TOTAL
===================================================== */

#contentWindow.network {
    display: none;
    align-items: stretch;
    justify-content: center;

    width: 100vw;
    height: min(82vh, 760px);
    max-height: 82vh;

    overflow: hidden;
}

#contentWindow.network.open {
    display: flex;
}

/* ROLAGEM INTERNA DA REDE */

#contentWindow.network #contentText {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    min-height: 0;
    height: 100%;
    max-height: 100%;

    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior: contain;

    padding: 30px max(40px, calc((100vw - 1000px) / 2));

    white-space: normal;
}

#contentWindow.network.open.loading {
    align-items: center;
    justify-content: center;
    height: min(82vh, 760px);
    max-height: 82vh;
    overflow: hidden;
}

#contentWindow.network.open.loading #contentText {
    display: none;
}

/* =====================================================
   CONTEÚDO DA REDE
===================================================== */

#networkContent {
    display: grid;
    grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
    column-gap: 45px;
    width: 100%;
    min-height: 100%;
    height: auto;
}

.networkColumn {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 0;
    min-height: 100%;
    height: auto;
}

.networkCategory {
    display: block;
    width: 100%;
    text-align: center;
    margin: 0 0 15px 0;
    padding-top: 100px;
    font-size: 1em;
    line-height: 1.4;
    font-weight: 700;
}

/* =====================================================
   NÚCLEO REGULAR
===================================================== */

.networkPeople {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(2, auto);
    align-content: center;
    justify-items: center;
    column-gap: 20px;
    row-gap: 18px;
    flex: 1;
    min-height: 0;
    width: 100%;
}

.networkPerson {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: var(--page-fg);
    text-decoration: none;
    text-align: center;
    min-width: 0;
}

.networkPerson::before {
    content: "";
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(100%, 18vh, 150px);
    aspect-ratio: 1 / 1;
    background: var(--photo-overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 1;
}

.networkPerson:hover::before {
    opacity: 1;
}

.networkPerson img {
    display: block;
    width: min(100%, 18vh, 150px);
    aspect-ratio: 1 / 1;
    height: auto;
    object-fit: contain;
    object-position: center;
    margin: 0 0 4px 0;
}

.networkPerson span {
    display: block;
    margin: 0;
    padding: 0;
    line-height: 1.2;
    text-align: center;
    transition: color 0.2s ease;
    overflow-wrap: anywhere;
}

.networkPerson:hover span {
    color: var(--page-hover);
}

/* =====================================================
   PARCERIAS
===================================================== */

.networkPartners {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: center;
    width: 100%;
    flex: 1;
    min-height: 0;
    gap: 7px;
    text-align: center;
}

.networkPartners a {
    display: block;
    max-width: 100%;
    color: var(--page-fg);
    text-decoration: none;
    text-align: right;
    line-height: 1.35;
    overflow-wrap: anywhere;
    transition: color 0.2s ease;
}

.networkPartners a:hover {
    color: var(--page-hover);
}

.networkBack {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--page-fg);
    text-decoration: none;
    transition: color 0.2s ease;
}

.networkBack:hover {
    color: var(--page-hover);
}

/* =====================================================
   EMAIL
===================================================== */

#emailContact {
    position: fixed;
    bottom: 3vh;
    right: 30px;
    z-index: 10;
    text-align: right;
    white-space: nowrap;
    font-size: calc(16px * var(--font-scale));
    -webkit-user-select: text;
    user-select: text;
    transition: opacity 0.6s ease;
}

#emailContact a {
    color: var(--page-fg);
    text-decoration: none;
    cursor: pointer;
    -webkit-user-select: text;
    user-select: text;
    transition: color 0.2s ease;
}

#emailContact a:hover {
    color: var(--page-hover);
}

/* =====================================================
   CONTROLES DO SITE
===================================================== */

#siteControls {
    position: fixed;
    left: 30px;
    bottom: 3vh;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: calc(14px * var(--font-scale));
    line-height: 1;
    white-space: nowrap;
    transition: opacity 0.6s ease;
}

.controlGroup {
    display: flex;
    align-items: center;
    gap: 5px;
}

.siteControl {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--page-fg);
    font-family: inherit;
    font-size: inherit;
    font-weight: inherit;
    cursor: pointer;
    padding: 3px 4px;
    transition: color 0.2s ease;
}

.siteControl:hover {
    color: var(--page-hover);
}

.siteControl.active {
    text-decoration: underline;
    text-underline-offset: 3px;
}

.controlDivider {
    width: 1px;
    height: 15px;
    background: var(--panel-border);
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #header {
        top: 35px;
        right: 25px;
        left: auto;
        transform: none;
    }

    #header img {
        width: clamp(40px, 18vw, 70px);
    }

    #mainMenu {
        top: 35px;
        left: 20px;
        transform: none;
        font-size: calc(13px * var(--font-scale));
        gap: 5px;
    }

    #realizationsDropdown {
        margin-left: 12px;
        gap: 5px;
    }

    #homeAnimation {
        width: calc(100vw - 40px);
        font-size: calc(13px * var(--font-scale));
    }

    #contentWindow {
        width: 100vw;
        max-width: none;
        max-height: 65vh;
        border-radius: 10px;
    }

    #contentText {
        max-height: 65vh;
        padding: 25px 20px;
        font-size: calc(clamp(12px, 3.2vw, 19px) * var(--font-scale));
        line-height: 1.4;
    }

    #contentWindow.open.loading {
        height: 65vh;
        max-height: 65vh;
    }

    #contentWindow.open.loading::after {
        width: 26px;
        height: 26px;
        flex-basis: 26px;
    }

    #contentWindow.network {
        width: 100vw;
        height: 78vh;
        max-height: 78vh;
    }

    #contentWindow.network #contentText {
        height: 100%;
        max-height: 100%;
        padding: 18px 20px;
        font-size: calc(11px * var(--font-scale));
        line-height: 1.3;
    }

    #contentWindow.network.open.loading {
        height: 78vh;
        max-height: 78vh;
    }

    #networkContent {
        grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
        column-gap: 12px;
    }

    .networkCategory {
        margin-bottom: 10px;
        font-size: 1em;
    }

    .networkPeople {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: repeat(2, auto);
        column-gap: 8px;
        row-gap: 14px;
    }

    .networkPerson img {
        width: min(100%, 11vh, 80px);
        margin-bottom: 3px;
    }

    .networkPerson::before {
        width: min(100%, 11vh, 80px);
    }

    .networkPerson span {
        font-size: 0.95em;
    }

    .networkPartners {
        gap: 6px;
    }

    .networkPartners a {
        line-height: 1.25;
        overflow-wrap: anywhere;
    }

    #emailContact {
        bottom: 20px;
        right: 20px;
        font-size: calc(13px * var(--font-scale));
    }

    #siteControls {
        left: 20px;
        bottom: 20px;
        gap: 8px;
        font-size: calc(12px * var(--font-scale));
    }
}

/* =====================================================
   TELAS COM POUCA ALTURA
===================================================== */

@media (max-height: 600px) and (min-width: 601px) {

    #contentWindow.network {
        height: 88vh;
        max-height: 88vh;
    }

    #contentWindow.network #contentText {
        padding-top: 15px;
        padding-bottom: 15px;
    }

    .networkPerson img {
        width: min(100%, 12vh, 95px);
    }

    .networkPerson::before {
        width: min(100%, 12vh, 95px);
    }

    .networkPartners {
        gap: 4px;
    }
}

/* =====================================================
   PULL TO REFRESH
===================================================== */

#pullIndicator {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translate(-50%, -50px);
    z-index: 9999;
    padding: 8px 16px;
    border-radius: 20px;
    background: var(--panel-bg);
    color: var(--page-fg);
    font-family: MyFont, sans-serif;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
}

#pullIndicator.visible {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* =====================================================
   MOBILE — ORIENTAÇÃO HORIZONTAL
===================================================== */

@media (orientation: landscape) and
(max-height: 600px) and
(max-width: 950px) {

    #header {
        top: 15px;
        right: 20px;
        left: auto;
        transform: none;
    }

    #header img {
        width: clamp(40px, 9vw, 70px);
    }

    #mainMenu {
        top: 15px;
        left: 20px;
        right: 100px;
        transform: none;
        flex-direction: row;
        align-items: flex-start;
        gap: 18px;
        font-size: calc(12px * var(--font-scale));
        line-height: 1.3;
    }

    #realizationsDropdown {
        position: absolute;
        top: 22px;
        left: 150px;
        margin: 0;
        padding: 8px 12px;
        max-height: calc(100dvh - 75px);
        overflow-y: auto;
        background: var(--panel-bg);
        gap: 5px;
    }

    #homeAnimation {
        width: 85vw;
        font-size: calc(12px * var(--font-scale));
    }

    #contentWindow {
        top: 55%;
        width: 100vw;
        max-width: none;
        max-height: 70dvh;
    }

    #contentText {
        max-height: 70dvh;
        padding: 12px 20px;
        font-size: calc(12px * var(--font-scale));
        line-height: 1.3;
    }

    #contentWindow.open.loading {
        top: 50%;
        height: 70dvh;
        max-height: 70dvh;
    }

    #contentWindow.network {
        width: 100vw;
        height: 78dvh;
        max-height: 78dvh;
    }

    #contentWindow.network #contentText {
        height: 100%;
        max-height: 100%;
        padding: 10px 20px;
        font-size: calc(11px * var(--font-scale));
        overflow-y: auto;
    }

    #contentWindow.network.open.loading {
        height: 78dvh;
        max-height: 78dvh;
    }

    #networkContent {
        grid-template-columns: 0.85fr 1.15fr;
        column-gap: 20px;
    }

    .networkCategory {
        padding-top: 0;
        margin-bottom: 6px;
        font-size: 1em;
    }

    .networkPeople {
        row-gap: 6px;
        column-gap: 8px;
    }

    .networkPerson img {
        width: min(100%, 14vh, 65px);
        margin-bottom: 2px;
    }

    .networkPerson::before {
        width: min(100%, 14vh, 65px);
    }

    .networkPerson span {
        font-size: 0.95em;
    }

    .networkPartners {
        gap: 4px;
    }

    .networkPartners a {
        font-size: 0.95em;
        line-height: 1.2;
    }

    #emailContact {
        bottom: 10px;
        right: 15px;
        font-size: calc(11px * var(--font-scale));
    }

    #siteControls {
        bottom: 10px;
        left: 15px;
        font-size: calc(11px * var(--font-scale));
        gap: 7px;
    }
}

/* =====================================================
   TEMA ESCURO — CONTEÚDO CARREGADO
===================================================== */

body.dark-mode #contentText,
body.dark-mode #contentText * {
    color: var(--page-fg) !important;
}

body.dark-mode #contentText a {
    color: var(--page-fg) !important;
}

/* =====================================================
   ACESSIBILIDADE — MOVIMENTO REDUZIDO
===================================================== */

@media (prefers-reduced-motion: reduce) {

    #contentWindow,
    #contentText,
    #homeAnimation,
    #background,
    #header,
    #mainMenu,
    #siteControls,
    #emailContact {
        transition-duration: 0.01ms;
    }

    #openingScene.playing #openingLogo {
        animation-duration: 0.01ms;
    }

    #contentWindow.open.loading::after {
        animation-duration: 2s;
    }
}

/* =====================================================
   MOBILE — RODAPÉ CENTRALIZADO
   E DESTAQUE DE TOQUE MONOCROMÁTICO
===================================================== */

/* Remove o realce azul padrão ao tocar em elementos interativos. */
* {
    -webkit-tap-highlight-color: transparent;
}

/* Quando houver seleção real de texto, usa realce cinza. */
::selection {
    background: rgba(128, 128, 128, 0.35);
    color: inherit;
}

@media (max-width: 600px) {

    #emailContact {
        left: 50%;
        right: auto;
        bottom: calc(48px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 24px);
        text-align: center;
        white-space: normal;
        font-size: calc(13px * var(--font-scale));
    }

    #siteControls {
        left: 50%;
        right: auto;
        bottom: calc(12px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        justify-content: center;
        width: max-content;
        max-width: calc(100vw - 20px);
        gap: 8px;
        font-size: calc(12px * var(--font-scale));
    }

    .siteControl {
        -webkit-tap-highlight-color: transparent;
        outline-color: var(--page-hover);
    }

    .siteControl:focus,
    .siteControl:active {
        background: transparent;
        color: var(--page-fg);
        box-shadow: none;
    }
}

/* Mantém o mesmo rodapé em celulares na orientação horizontal. */
@media (orientation: landscape) and

<script>

/* =====================================================
   CONFIGURAÇÕES GERAIS
===================================================== */

const LOGO_LIGHT =

const LOGO_DARK =
    "https://raw.githubusercontent.com/redesencontros/rdctsite/8cf3ec8ef2db295bfd288276372b4631fe39179f/ativos/logos/rdctbr.png";


/* =====================================================
   IDIOMA E PREFERÊNCIAS
===================================================== */

let currentLanguage =
    localStorage.getItem("rdct-language") || "pt";

let isDarkMode =
    localStorage.getItem("rdct-dark-mode") === "true";


/* =====================================================
   PALAVRAS DA HOME — PT / EN / ES
===================================================== */

const homeWords = {

    pt: [
        "ARTE",
        "CULTURA",
        "EDUCAÇÃO",
        "COMUNIDADE",
        "TERRITÓRIO",
        "CRIAÇÃO",

    ],

    en: [
        "ART",

    ],

        "EXPERIMENTACIÓN",
        "DIÁLOGO",
        "TRANSDISCIPLINARIEDAD",
        "COOPERACIÓN",
        "MEMORIA"
    ]

};


/* =====================================================
   CENA DE ABERTURA — PRIMEIRO CARREGAMENTO
===================================================== */

const openingScene =
    document.getElementById("openingScene");

const openingLogo =
    document.getElementById("openingLogo");

const OPENING_DELAY = 1000;
const OPENING_TOTAL_DURATION = 3200;

let openingStarted = false;


function runOpeningScene() {

    if (openingStarted) return;

    openingStarted = true;

    openingLogo.src =
        isDarkMode ? LOGO_DARK : LOGO_LIGHT;

    setTimeout(() => {

        openingScene.classList.remove("playing");

        void openingLogo.offsetWidth;

        openingScene.classList.add("playing");

    }, OPENING_DELAY);

}


openingLogo.addEventListener("animationend", event => {

    if (event.animationName !== "openingSequence") return;

    openingScene.classList.remove("playing");

    openingScene.style.display = "none";

    document.body.classList.remove("intro-active");

    startHomeAnimation();

});


/* =====================================================
   HOME — CONTROLE DA ANIMAÇÃO DE PALAVRAS
===================================================== */

const homeAnimation =
    document.getElementById("homeAnimation");

const homeWord =
    document.getElementById("homeWord");

const HOME_INITIAL_DELAY = 2000;
const HOME_FADE_DURATION = 600;
const HOME_VISIBLE_DURATION = 2000;

let homeTimeout = null;
let homeExitTimeout = null;
let homeExitCallbacks = [];

let homeDeck = [];
let lastHomeWordIndex = null;
let currentHomeWordIndex = null;
let homeAnimationActive = false;


/* =====================================================
   HOME — OBTENÇÃO DAS PALAVRAS
===================================================== */

function getHomeWords() {

    return homeWords[currentLanguage] || homeWords.pt;

}


/* =====================================================
   HOME — EMBARALHAMENTO DO DECK
===================================================== */

function shuffleHomeDeck() {

    const wordCount = homeWords.pt.length;

    const deck = Array.from(
        { length: wordCount },
        (_, index) => index
    );

    for (let i = deck.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [deck[i], deck[j]] = [deck[j], deck[i]];

    }

    if (
        deck.length > 1 &&
        deck[0] === lastHomeWordIndex
    ) {

        const swapIndex =
            1 + Math.floor(Math.random() * (deck.length - 1));

        [deck[0], deck[swapIndex]] =
        [deck[swapIndex], deck[0]];

    }

    return deck;

}


/* =====================================================
   HOME — CRIAR NOVO DECK
===================================================== */

function createHomeDeck() {

    homeDeck = shuffleHomeDeck();

}


/* =====================================================
   HOME — SORTEAR PRÓXIMA PALAVRA
===================================================== */

function showRandomHomeWord() {

    if (homeDeck.length === 0) {

        createHomeDeck();

    }

    if (homeDeck.length === 0) return;

    const index = homeDeck.shift();

    currentHomeWordIndex = index;

    lastHomeWordIndex = index;

    const words = getHomeWords();

    homeWord.textContent = words[index];

}


/* =====================================================
   HOME — CICLO DE ANIMAÇÃO
===================================================== */

function runHomeWordCycle() {

    if (!homeAnimationActive) return;

    showRandomHomeWord();

    homeAnimation.classList.remove("hidden");

    requestAnimationFrame(() => {

        if (!homeAnimationActive) return;

        requestAnimationFrame(() => {

            homeAnimation.classList.add("visible");

        });

    });

    homeTimeout = setTimeout(() => {

        if (!homeAnimationActive) return;

        homeAnimation.classList.remove("visible");

        homeTimeout = setTimeout(() => {

            if (!homeAnimationActive) return;

            runHomeWordCycle();

        }, HOME_FADE_DURATION);

    }, HOME_FADE_DURATION + HOME_VISIBLE_DURATION);

}


/* =====================================================
   HOME — INICIAR ANIMAÇÃO
===================================================== */

function startHomeAnimation() {

    stopHomeAnimation();

    if (!getHomeWords().length) return;

    homeAnimationActive = true;

    homeAnimation.classList.remove("visible");

    homeAnimation.classList.add("hidden");

    homeTimeout = setTimeout(() => {

        if (!homeAnimationActive) return;

        runHomeWordCycle();

    }, HOME_INITIAL_DELAY);

}


/* =====================================================
   HOME — FINALIZAR ANIMAÇÃO
===================================================== */

function finishHomeAnimation(callback) {

    if (callback) {
        homeExitCallbacks.push(callback);
    }

    if (homeExitTimeout !== null) return;

    const wasVisible =
        homeAnimation.classList.contains("visible");

    homeAnimationActive = false;

    if (homeTimeout !== null) {

        clearTimeout(homeTimeout);

        homeTimeout = null;

    }

    if (wasVisible) {

        homeAnimation.classList.remove("visible");

        homeExitTimeout = setTimeout(() => {

            homeAnimation.classList.add("hidden");

            homeExitTimeout = null;

            const callbacks = homeExitCallbacks.splice(0);

            callbacks.forEach(fn => fn());

        }, HOME_FADE_DURATION);

    } else {

        homeAnimation.classList.add("hidden");

        const callbacks = homeExitCallbacks.splice(0);

        callbacks.forEach(fn => fn());

    }

}


/* =====================================================
   HOME — INTERROMPER ANIMAÇÃO
===================================================== */

function stopHomeAnimation() {

    homeAnimationActive = false;

    if (homeTimeout !== null) {

        clearTimeout(homeTimeout);

        homeTimeout = null;

    }

    if (homeExitTimeout !== null) {

        clearTimeout(homeExitTimeout);

        homeExitTimeout = null;

    }

    homeExitCallbacks = [];

    homeAnimation.classList.remove("visible");

    homeAnimation.classList.add("hidden");

}

/* =====================================================
   TEXTO ALTERNATIVO HOME
===================================================== */

function updateLogoTitle() {
    const logo = document.getElementById('headerImage');

    const titles = {
        pt: 'Início',
        en: 'Home',
        es: 'Inicio'
    };

    if (logo) {
        logo.title = titles[currentLanguage] || 'Início';
    }
}

/* =====================================================
   BOIDS BACKGROUND
===================================================== */

const canvas = document.getElementById("canvas");

const gl =
    canvas.getContext("webgl", {
        alpha: false,
        antialias: true
    }) ||
    canvas.getContext("experimental-webgl");

if (!gl) {
    throw new Error("WebGL não disponível.");
}

let width;
let height;
let pixelRatio = 1;

function resize() {

    pixelRatio = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);

    gl.viewport(0, 0, canvas.width, canvas.height);
}

window.addEventListener("resize", resize);
resize();


/* SHADERS */

const vertexShaderSource = `
attribute vec2 a_position;

uniform vec2 u_resolution;
uniform float u_pixelRatio;

void main() {

    vec2 zeroToOne = a_position / u_resolution;
    vec2 zeroToTwo = zeroToOne * 2.0;
    vec2 clipSpace = zeroToTwo - 1.0;

    gl_Position = vec4(
        clipSpace * vec2(1, -1),
        0,
        1
    );

    gl_PointSize = 1.5 * u_pixelRatio;

}`;

const fragmentShaderSource = `
precision mediump float;

void main() {

    gl_FragColor = vec4(
        0.5333333,
        0.5333333,
        0.5333333,
        0.4
    );

}`;

function createShader(type, source) {

    const shader = gl.createShader(type);

    gl.shaderSource(shader, source);
    gl.compileShader(shader);

    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader));
        throw new Error("Erro ao compilar shader.");
    }

    return shader;
}

const vertexShader = createShader(
    gl.VERTEX_SHADER,
    vertexShaderSource
);

const fragmentShader = createShader(
    gl.FRAGMENT_SHADER,
    fragmentShaderSource
);

const program = gl.createProgram();

gl.attachShader(program, vertexShader);
gl.attachShader(program, fragmentShader);
gl.linkProgram(program);

if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(program));
    throw new Error("Erro ao criar programa WebGL.");
}

gl.useProgram(program);

/* BLENDING PARA PERMITIR 75% DE OPACIDADE */

gl.enable(gl.BLEND);

gl.blendFunc(
    gl.SRC_ALPHA,
    gl.ONE_MINUS_SRC_ALPHA
);

const positionLocation =
    gl.getAttribLocation(program, "a_position");

const resolutionLocation =
    gl.getUniformLocation(program, "u_resolution");

const pixelRatioLocation =
    gl.getUniformLocation(program, "u_pixelRatio");

const positionBuffer = gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
gl.enableVertexAttribArray(positionLocation);

gl.vertexAttribPointer(
    positionLocation,
    2,
    gl.FLOAT,
    false,
    0,
    0
);


/* BOIDS CONFIGURATION */

const isMobile = window.innerWidth < 768;
const BOID_COUNT = isMobile ? 1500 : 4000;

const boids = [];

let frame = 0;

const perception = 22;
const cellSize = perception;

let grid = {};

function buildGrid() {

    grid = {};

    for (let i = 0; i < boids.length; i++) {

        const b = boids[i];

        const cx = Math.floor(b.x / cellSize);
        const cy = Math.floor(b.y / cellSize);

        const key = cx + "," + cy;

        if (!grid[key]) grid[key] = [];

        grid[key].push(b);
    }
}

function getNearbyBoids(boid) {

    const cx = Math.floor(boid.x / cellSize);
    const cy = Math.floor(boid.y / cellSize);

    let neighbors = [];

    for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {

            const key = (cx + x) + "," + (cy + y);

            if (grid[key]) {
                neighbors = neighbors.concat(grid[key]);
            }
        }
    }

    return neighbors;
}


/* GLOBAL FLOW */

let flowTime = 0;
const flowScale = 0.003;
let wavePhase = 0;

const entrySide = Math.floor(Math.random() * 4);


/* BOID CLASS */

class Boid {

    constructor() {

        const clusterRadius = 150;
        const angle = Math.random() * Math.PI * 2;
        const r = Math.random() * clusterRadius;
        const far = 300;

        if (entrySide === 0) {

            this.x = -far + Math.cos(angle) * r;
            this.y = height / 2 + Math.sin(angle) * r;

            this.vx = 3.5;
            this.vy = (Math.random() - 0.5) * 0.4;
        }

        if (entrySide === 1) {

            this.x = width + far + Math.cos(angle) * r;
            this.y = height / 2 + Math.sin(angle) * r;

            this.vx = -3.5;
            this.vy = (Math.random() - 0.5) * 0.4;
        }

        if (entrySide === 2) {

            this.x = width / 2 + Math.cos(angle) * r;
            this.y = -far + Math.sin(angle) * r;

            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = 3.5;
        }

        if (entrySide === 3) {

            this.x = width / 2 + Math.cos(angle) * r;
            this.y = height + far + Math.sin(angle) * r;

            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = -3.5;
        }
    }

    update() {

        let alignX = 0;
        let alignY = 0;

        let cohesionX = 0;
        let cohesionY = 0;

        let separationX = 0;
        let separationY = 0;

        let count = 0;

        const perceptionSq = perception * perception;
        const neighbors = getNearbyBoids(this);

        for (let other of neighbors) {

            if (other === this) continue;

            const dx = other.x - this.x;
            const dy = other.y - this.y;

            const distSq = dx * dx + dy * dy;

            if (distSq < perceptionSq) {

                alignX += other.vx;
                alignY += other.vy;

                cohesionX += other.x;
                cohesionY += other.y;

                if (distSq < 60) {
                    separationX -= dx;
                    separationY -= dy;
                }

                count++;
            }
        }

        if (count > 0) {

            alignX /= count;
            alignY /= count;

            cohesionX /= count;
            cohesionY /= count;

            this.vx += (alignX - this.vx) * 0.05;
            this.vy += (alignY - this.vy) * 0.05;

            this.vx += (cohesionX - this.x) * 0.001;
            this.vy += (cohesionY - this.y) * 0.001;

            this.vx += separationX * 0.02;
            this.vy += separationY * 0.02;
        }

        const globalPull = 0.0001;

        const driftX =
            width / 2 +
            Math.sin(flowTime * 0.2) * width * 0.35;

        const driftY =
            height / 2 +
            Math.cos(flowTime * 0.15) * height * 0.35;

        this.vx += (driftX - this.x) * globalPull;
        this.vy += (driftY - this.y) * globalPull;

        this.vy += (height / 2 - this.y) * 0.00001;

        this.vx += Math.sin(wavePhase + this.x * 0.01) * 0.05;
        this.vy += Math.cos(wavePhase + this.y * 0.01) * 0.05;

        const nx = this.x * flowScale;
        const ny = this.y * flowScale;

        const fx = Math.sin(nx + flowTime);
        const fy = Math.cos(ny + flowTime * 0.8);

        this.vx += fx * 0.05;
        this.vy += fy * 0.05;

        this.vx += Math.sin(flowTime * 0.2) * 0.01;

        this.vx += (Math.random() - 0.5) * 0.03;
        this.vy += (Math.random() - 0.5) * 0.03;

        const margin = 120;
        const push = 0.002;

        if (this.x < margin) this.vx += push;
        if (this.x > width - margin) this.vx -= push;
        if (this.y < margin) this.vy += push;
        if (this.y > height - margin) this.vy -= push;

        const speedSq =
            this.vx * this.vx +
            this.vy * this.vy;

        const maxSpeed = 3.5;

        if (speedSq > maxSpeed * maxSpeed) {

            const scale = maxSpeed / Math.sqrt(speedSq);

            this.vx *= scale;
            this.vy *= scale;
        }

        this.x += this.vx;
        this.y += this.vy;
    }
}


/* INITIALIZE BOIDS */

for (let i = 0; i < BOID_COUNT; i++) {
    boids.push(new Boid());
}

const positions = new Float32Array(BOID_COUNT * 2);

gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

gl.bufferData(
    gl.ARRAY_BUFFER,
    positions.byteLength,
    gl.DYNAMIC_DRAW
);


/* ANIMATION LOOP */

function animate() {

    frame++;

    flowTime += 0.004;
    wavePhase += 0.015;

    buildGrid();

    for (let i = 0; i < boids.length; i++) {

        if (i % 10 === frame % 10) {
            boids[i].update();
        }

        positions[i * 2] = boids[i].x;
        positions[i * 2 + 1] = boids[i].y;
    }

    const dark =
        document.body.classList.contains("dark-mode");

    const backgroundColor =
        dark ? 26 / 255 : 245 / 255;

    gl.clearColor(
        backgroundColor,
        backgroundColor,
        backgroundColor,
        1
    );

    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform2f(
        resolutionLocation,
        width,
        height
    );

    gl.uniform1f(
        pixelRatioLocation,
        pixelRatio
    );

    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);

    gl.bufferSubData(
        gl.ARRAY_BUFFER,
        0,
        positions
    );

    gl.drawArrays(
        gl.POINTS,
        0,
        BOID_COUNT
    );

    requestAnimationFrame(animate);
}

animate();

/* =====================================================
   ACCESSIBILITY AND LANGUAGE CONTROLS
===================================================== */

const fontDecrease =
    document.getElementById("fontDecrease");

const fontIncrease =
    document.getElementById("fontIncrease");

const themeToggle =
    document.getElementById("themeToggle");

let savedFontScale =
    Number(localStorage.getItem("rdct-font-scale"));

let fontScale =
    Number.isFinite(savedFontScale) &&
    savedFontScale >= 0.8 &&
    savedFontScale <= 1.5
        ? savedFontScale
        : 1;


/* =====================================================
   FONT SIZE
===================================================== */

function updateFontSize() {

    fontScale = Math.max(
        0.8,
        Math.min(1.5, fontScale)
    );

    fontScale = Math.round(fontScale * 10) / 10;

    document.documentElement.style.setProperty(
        "--font-scale",
        String(fontScale)
    );

    localStorage.setItem(
        "rdct-font-scale",
        String(fontScale)
    );

}

fontDecrease.addEventListener("click", () => {

    fontScale = Math.round((fontScale - 0.1) * 10) / 10;
    updateFontSize();

});

fontIncrease.addEventListener("click", () => {

    fontScale = Math.round((fontScale + 0.1) * 10) / 10;
    updateFontSize();

});


/* =====================================================
   COLOR THEME + LOGO
===================================================== */

function updateTheme() {

    document.body.classList.toggle(
        "dark-mode",
        isDarkMode
    );

    themeToggle.classList.toggle(
        "active",
        isDarkMode
    );

    themeToggle.textContent =
        isDarkMode ? "◑" : "◐";

    const logoSource =
        isDarkMode ? LOGO_DARK : LOGO_LIGHT;

    headerImage.src = logoSource;
    openingLogo.src = logoSource;

    localStorage.setItem(
        "rdct-dark-mode",
        String(isDarkMode)
    );

}

themeToggle.addEventListener("click", () => {

    isDarkMode = !isDarkMode;
    updateTheme();

});


/* =====================================================
   LANGUAGE INTERFACE
===================================================== */

function updateLanguageInterface() {

    const t = translations[currentLanguage];

    document.documentElement.lang =
        currentLanguage === "pt" ? "pt-BR" : currentLanguage;

    document.querySelector(
        '[data-content="sobre"]'
    ).textContent = t.sobre;

    document.querySelector(
        '[data-content="rede"]'
    ).textContent = t.rede;

    realizationsToggle.textContent = t.realizacoes;

    realizationItems.forEach(item => {

        const number = item.dataset.realization;

        item.textContent =
            t.realization + " " + number;

    });

    document.querySelectorAll(
        "[data-language]"
    ).forEach(button => {

        button.classList.toggle(
            "active",
            button.dataset.language === currentLanguage
        );

    });

}


/* =====================================================
   FECHAMENTO ANIMADO DO CONTEÚDO
===================================================== */

function closeContent(callback) {

    if (callback) {
        contentCloseCallbacks.push(callback);
    }

    if (contentCloseTimeout !== null) return;

    contentRequestId++;

    const isOpen =
        contentWindow.classList.contains("open");

    const isVisible =
        contentWindow.classList.contains("visible");

    if (!isOpen) {

        contentWindow.classList.remove(
            "open",
            "visible",
            "plain",
            "realization",
            "network",
            "loading"
        );

        contentWindow.dataset.section = "";
        contentText.textContent = "";

        const callbacks = contentCloseCallbacks.splice(0);
        callbacks.forEach(fn => fn());

        return;
    }

    contentWindow.classList.remove("visible");

    contentCloseTimeout = setTimeout(() => {

        contentWindow.classList.remove(
            "open",
            "plain",
            "realization",
            "network",
            "loading"
        );

        contentWindow.dataset.section = "";

        contentText.textContent = "";
        contentText.scrollTop = 0;

        contentCloseTimeout = null;

        const callbacks = contentCloseCallbacks.splice(0);
        callbacks.forEach(fn => fn());

    }, isVisible ? 600 : 0);

}


/* =====================================================
   PREPARA A ENTRADA DE UM NOVO CONTEÚDO
===================================================== */

function prepareContent(callback) {

    const transitionId = ++contentTransitionId;

    finishHomeAnimation(() => {

        if (transitionId !== contentTransitionId) return;

        closeContent(() => {

            if (transitionId !== contentTransitionId) return;

            callback();

        });

    });

}


/* =====================================================
   TROCA DE IDIOMA
===================================================== */

function changeLanguage(language) {

    if (!translations[language]) return;

    currentLanguage = language;

    localStorage.setItem(
        "rdct-language",
        currentLanguage
    );

    updateLanguageInterface();
    updateLogoTitle();

    const section = contentWindow.dataset.section || "";

    if (section === "sobre" || section === "rede") {

        const requestId = ++contentRequestId;

        contentWindow.classList.add("loading");

        loadText(
            getContentPath(section),
            contentText,
            requestId
        ).finally(() => {

            if (requestId === contentRequestId) {
                contentWindow.classList.remove("loading");
            }

        });

    } else if (section.startsWith("realizacao-")) {

        const number = section.replace("realizacao-", "");

        contentText.textContent =
            translations[currentLanguage].realization +
            " " + number + ".";

    }

}


/* LANGUAGE BUTTONS */

document.querySelectorAll(
    "[data-language]"
).forEach(button => {

    button.addEventListener("click", () => {

        changeLanguage(button.dataset.language);

    });

});


/* RESTORE LANGUAGE */

if (!translations[currentLanguage]) {
    currentLanguage = "pt";
}

updateLanguageInterface();
updateLogoTitle();


/* RESTORE PREFERENCES */

updateFontSize();
updateTheme();


/* =====================================================
   LOAD TEXT
===================================================== */

async function loadText(path, target, requestId) {

    try {

        const response = await fetch(path);

        if (!response.ok) {
            throw new Error("Não foi possível carregar " + path);
        }

        const text = await response.text();

        if (requestId !== contentRequestId) {
            return;
        }

        target.innerHTML = text.trim();
        contentText.scrollTop = 0;

    } catch (error) {

        if (requestId !== contentRequestId) {
            return;
        }

        console.error(error);

        target.textContent =
            translations[currentLanguage].error;
    }

}


/* =====================================================
   ENTRADA VISUAL DO CONTEÚDO
===================================================== */

function revealContent() {

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            contentWindow.classList.add("visible");

        });

    });

}


/* =====================================================
   OPEN CONTENT
===================================================== */

function openPlainContent(section, path) {

    prepareContent(() => {

        const requestId = ++contentRequestId;

        contentWindow.classList.remove("realization");

        contentWindow.classList.add("plain");
        contentWindow.classList.add("loading");

        contentWindow.classList.toggle(
            "network",
            section === "rede"
        );

        contentWindow.classList.add("open");

        contentWindow.dataset.section = section;

        contentText.scrollTop = 0;
        contentText.textContent = "";

        revealContent();

        loadText(path, contentText, requestId)
            .finally(() => {

                if (requestId === contentRequestId) {
                    contentWindow.classList.remove("loading");
                }

            });

    });

}


/* =====================================================
   OPEN REALIZATION
===================================================== */

function openRealization(number) {

    prepareContent(() => {

        contentRequestId++;

        contentWindow.classList.remove(
            "plain",
            "network",
            "loading"
        );

        contentWindow.classList.add("realization");
        contentWindow.classList.add("open");

        contentWindow.dataset.section =
            "realizacao-" + number;

        contentText.scrollTop = 0;

        contentText.textContent =
            translations[currentLanguage].realization +
            " " + number + ".";

        revealContent();

    });

}


/* =====================================================
   LOGO — RETORNAR À HOME
===================================================== */

headerImage.addEventListener("click", () => {

    ++contentTransitionId;

    realizationsDropdown.classList.remove("open");

    closeContent(() => {

        startHomeAnimation();

    });

});


/* =====================================================
   ABOUT AND NETWORK
===================================================== */

menuItems.forEach(item => {

    item.addEventListener("click", () => {

        const section = item.dataset.content;

        realizationsDropdown.classList.remove("open");

        openPlainContent(
            section,
            getContentPath(section)
        );

    });

});


/* =====================================================
   REALIZATIONS DROPDOWN
===================================================== */

realizationsToggle.addEventListener("click", () => {

    const shouldOpen =
        !realizationsDropdown.classList.contains("open");

    const transitionId = ++contentTransitionId;

    finishHomeAnimation(() => {

        if (transitionId !== contentTransitionId) return;

        closeContent(() => {

            if (transitionId !== contentTransitionId) return;

            realizationsDropdown.classList.toggle(
                "open",
                shouldOpen
            );

        });

    });

});


/* =====================================================
   REALIZATION WINDOWS
===================================================== */

realizationItems.forEach(item => {

    item.addEventListener("click", () => {

        const number = item.dataset.realization;

        realizationsDropdown.classList.remove("open");

        openRealization(number);

    });

});


/* =====================================================
   CLOSE WHEN CLICKING OUTSIDE
===================================================== */

document.addEventListener("pointerdown", event => {

    const isContentOpen =
        contentWindow.classList.contains("open");

    if (!isContentOpen) return;

    if (contentWindow.contains(event.target)) return;

    if (event.target.closest("#siteControls")) return;

    if (event.target.closest("#header")) return;

    if (event.target.closest("#mainMenu")) return;

    closeContent();

});


/* =====================================================
   CLOSE WITH ESCAPE
===================================================== */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {

        closeContent();

        realizationsDropdown.classList.remove("open");
    }

});


/* =====================================================
   PULL TO REFRESH — MOBILE
===================================================== */

if (window.matchMedia("(max-width: 600px)").matches) {

    const pullIndicator =
        document.getElementById("pullIndicator");

    let touchStartY = 0;
    let pullDistance = 0;
    let pulling = false;

    const pullThreshold = 90;
    const pullMaximum = 120;

    document.addEventListener("touchstart", event => {

        if (event.touches.length !== 1) return;

        if (
            event.target.closest(
                "#mainMenu, #contentWindow, #emailContact, #siteControls, a, button"
            )
        ) {
            return;
        }

        touchStartY = event.touches[0].clientY;
        pullDistance = 0;
        pulling = true;

    }, { passive: true });


    document.addEventListener("touchmove", event => {

        if (!pulling) return;

        const currentY = event.touches[0].clientY;
        const distance = currentY - touchStartY;

        if (distance > 0) {

            pullDistance = Math.min(distance, pullMaximum);

            if (pullDistance > 10) {

                event.preventDefault();

                pullIndicator.classList.add("visible");

                pullIndicator.style.top =
                    (12 + pullDistance * 0.45) + "px";

                pullIndicator.textContent =
                    pullDistance >= pullThreshold
                    ? "Solte para atualizar"
                    : "Puxe para atualizar";
            }
        }

    }, { passive: false });


    document.addEventListener("touchend", () => {

        if (!pulling) return;

        if (pullDistance >= pullThreshold) {

            pullIndicator.textContent = "Atualizando...";

            window.location.reload();

        } else {

            pullIndicator.classList.remove("visible");
            pullIndicator.style.top = "12px";
        }

        pulling = false;
        pullDistance = 0;

    });


    document.addEventListener("touchcancel", () => {

        pulling = false;
        pullDistance = 0;

        pullIndicator.classList.remove("visible");
        pullIndicator.style.top = "12px";

    });

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

runOpeningScene();

</script>
