
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>bernardo stumpf</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: sans-serif;
    -webkit-user-select: none;
    user-select: none;
}

/* =====================================================
   TYPOGRAPHY
===================================================== */

@font-face {
    font-family: "MyFont";
    src: url("https://redesencontros.github.io/dancaeissoaquio/assets/fonts/jost3.woff2") format("woff2");
    font-weight: 370;
    font-style: normal;
}

/* =====================================================
   BACKGROUND GAME
===================================================== */

#backgroundGame {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: #ffffff;
}

#gameCanvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* =====================================================
   TYPOGRAPHY SHARED
===================================================== */

#mainMenu,
#backHome,
#emailContact,
#contentWindow {
    font-family: MyFont, sans-serif;
    font-weight: 370;
    color: #000000;
}

/* =====================================================
   MAIN MENU
===================================================== */

#mainMenu {
    position: fixed;
    top: 5vh;
    left: 30px;
    z-index: 20;

    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;

    font-size: 16px;
    line-height: 1.4;
}

/* NOME */

#menuName {
    font-weight: 700;
    margin-bottom: 5px;
    white-space: nowrap;
}

/* ITENS DO MENU */

.menuItem,
.realizationItem {
    position: relative;
    color: #000000;
    white-space: nowrap;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.2s ease;
}

.menuItem:hover,
.realizationItem:hover {
    color: #888888;
}

/* ESPAÇO ENTRE REALIZAÇÕES E CURRÍCULO */

.menuSection {
    margin-top: 25px;
}

/* =====================================================
   CONTENT WINDOW
===================================================== */

#contentWindow {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;

    display: none;

    width: min(900px, 72vw);
    height: 75vh;

    overflow: hidden;

    font-size: 16px;
    line-height: 1.5;
    text-align: left;
}

#contentWindow.open {
    display: block;
}

/* =====================================================
   CONTENT TEXT
===================================================== */

#contentText {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
}

/* =====================================================
   GOOGLE DOCS EMBEDS
===================================================== */

.documentFrame {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
    background: #ffffff;
}

/* =====================================================
   BOTTOM LINKS
===================================================== */

#backHome,
#emailContact {
    position: fixed;
    bottom: 3vh;
    z-index: 20;

    color: #000000;
    font-size: 16px;
    text-decoration: none;
    white-space: nowrap;

    transition: color 0.2s ease;
}

/* VOLTAR À ESQUERDA */

#backHome {
    left: 30px;
}

/* EMAIL À DIREITA */

#emailContact {
    right: 30px;
    text-align: right;
    -webkit-user-select: text;
    user-select: text;
}

#backHome:hover,
#emailContact:hover {
    color: #888888;
}

#emailContact a {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
    -webkit-user-select: text;
    user-select: text;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #mainMenu {
        top: 35px;
        left: 20px;
        font-size: 13px;
        gap: 5px;
    }

    #contentWindow {
        width: calc(100vw - 40px);
        height: 68vh;
        max-height: 68vh;
        font-size: 13px;
        line-height: 1.4;
    }

    #backHome,
    #emailContact {
        bottom: 20px;
        font-size: 13px;
    }

    #backHome {
        left: 20px;
    }

    #emailContact {
        right: 20px;
    }
}

</style>
</head>

<body>

<!-- =================================================
     BACKGROUND GAME
================================================== -->

<div id="backgroundGame">
    <canvas id="gameCanvas"></canvas>
</div>


<!-- =================================================
     MAIN MENU
================================================== -->

<nav id="mainMenu">

    <div id="menuName">
        bernardo stumpf
    </div>

    <div class="realizationItem" data-realization="1">
        Realização 1
    </div>

    <div class="realizationItem" data-realization="2">
        Realização 2
    </div>

    <div class="realizationItem" data-realization="3">
        Realização 3
    </div>

    <div class="realizationItem" data-realization="4">
        Realização 4
    </div>

    <div class="realizationItem" data-realization="5">
        Realização 5
    </div>

    <div class="realizationItem" data-realization="6">
        Realização 6
    </div>

    <div class="realizationItem" data-realization="7">
        Realização 7
    </div>

    <div class="realizationItem" data-realization="8">
        Realização 8
    </div>

    <div class="realizationItem" data-realization="9">
        Realização 9
    </div>

    <div class="realizationItem" data-realization="10">

    </div>

    <div class="realizationItem" data-realization="11">

    <div class="realizationItem" data-realization="12">

    <div class="realizationItem" data-realization="14">

    <div class="realizationItem" data-realization="15">

    <div class="menuItem menuSection" data-section="curriculo">

    <div class="menuItem" data-section="portfolio">

    </div>

</nav>


<!-- =================================================
     CONTENT AREA
================================================== -->

<div id="contentWindow">
    <div id="contentText"></div>
</div>


<!-- =================================================
     BOTTOM LINKS
================================================== -->

<a id="backHome" href="https://rdct.me/">
    Voltar
</a>

<div id="emailContact">
    <a href="mailto:bernardostumpf@yahoo.com">
        bernardostumpf@yahoo.com
    </a>
</div>


<script>

/* =====================================================
   BACKGROUND GAME
===================================================== */

const gameCanvas = document.getElementById("gameCanvas");
const gameContext = gameCanvas.getContext("2d");

function resizeGameCanvas() {

    const pixelRatio = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    gameCanvas.width = Math.round(
        window.innerWidth * pixelRatio
    );

    gameCanvas.height = Math.round(
        window.innerHeight * pixelRatio
    );

    gameCanvas.style.width = window.innerWidth + "px";
    gameCanvas.style.height = window.innerHeight + "px";

    gameContext.setTransform(
        pixelRatio,
        0,
        0,
        pixelRatio,
        0,
        0
    );
}

window.addEventListener("resize", resizeGameCanvas);

resizeGameCanvas();


/* =====================================================
   MENU AND CONTENT
===================================================== */

const contentWindow = document.getElementById("contentWindow");
const contentText = document.getElementById("contentText");

const realizationItems = document.querySelectorAll(".realizationItem");
const sectionItems = document.querySelectorAll(".menuItem[data-section]");


/* =====================================================
   GOOGLE DOCS DOCUMENTS
===================================================== */

/* CURRÍCULO */

const curriculumURL =
    "https://docs.google.com/document/d/e/2PACX-1vTS1OYUMlFCzGvgsddqiGVi9nUt_ZqZG2aZbArTTmldwmwdSdFXiZVp0Z3YZQXMmVUwaSQe57r78GMv/pub?embedded=true";

/* PORTFÓLIO */

const portfolioURL =
    "https://docs.google.com/document/d/e/2PACX-1vSBisXjBJd5wP8NWj26urTI2fiSlecRPKQ_5B_hPPbTK7Val2MXKU0cyRmcN5tmlkh48Dl3DVqWCYxV/pub?embedded=true";


/* =====================================================
   OPEN CONTENT
===================================================== */

function openContent(title) {

    contentText.innerHTML = "";

    if (title === "Currículo" || title === "Portfólio") {

        const frame = document.createElement("iframe");

        frame.className = "documentFrame";

        if (title === "Currículo") {
            frame.src = curriculumURL;
            frame.title = "Currículo de bernardo stumpf";
        }

        if (title === "Portfólio") {
            frame.src = portfolioURL;
            frame.title = "Portfólio de bernardo stumpf";
        }

        contentText.appendChild(frame);

    } else {

        contentText.textContent = title;
    }

    contentWindow.classList.add("open");
}


/* =====================================================
   CLOSE CONTENT
===================================================== */

function closeContent() {

    contentWindow.classList.remove("open");
}


/* =====================================================
   REALIZATION ITEMS
===================================================== */

realizationItems.forEach(item => {

    item.addEventListener("click", () => {

        const number = item.dataset.realization;

        openContent(
            "Conteúdo da realização " + number + "."
        );
    });
});


/* =====================================================
   CURRICULUM AND PORTFOLIO
===================================================== */

sectionItems.forEach(item => {

    item.addEventListener("click", () => {

        const section = item.dataset.section;

        if (section === "curriculo") {
            openContent("Currículo");
        }

        if (section === "portfolio") {
            openContent("Portfólio");
        }
    });
});


/* =====================================================
   CLICK OUTSIDE
===================================================== */

document.addEventListener("pointerdown", event => {

    if (!contentWindow.classList.contains("open")) {
        return;
    }

    if (contentWindow.contains(event.target)) {
        return;
    }

    closeContent();
});


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
        closeContent();
    }
});

</script>

</body>
</html>
