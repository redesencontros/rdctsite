     ORGANIC MESH
================================================== -->

<script>

(() => {

// ==================================================
// CONFIGURAÇÕES
// ==================================================

const config = {

    particleCount: 1200,

    size: 0.6,

    // Escalas de conexão
    minLineLength: 3,
    shortRange: 10,
    mediumRange: 100,
    maxLineLength: 500,

    // Repulsão intermediária
    repulsionRadius: 65,
    repulsionStrength: 0.0008,

    // Distribuição das escalas
    shortConnections: 0.48,
    mediumConnections: 0.34,
    longConnections: 0.18,

    // Quantidade de conexões
    minConnections: 2,
    maxConnections: 10,

    // Movimento
    speed: 0.2,
    movement: 0.065,
    chaos: 0.8,

    // Elasticidade
    springStrength: 0.00000005,
    springVariation: 0.0000055,

    // Deformação
    deformationStrength: 0.0005,
    stretchAmount: 55,
    twistAmount: 55,
    waveAmount: 55,

    // Liberdade espacial
    cohesion: 0.01,

    // Aparência
    lineWidth: 0.03,
    lineColor: "rgba(45,45,45,0.25)",
    background: "transparent",

    // Otimização
    repulsionCellSize: 100,
    connectionCellSize: 100,

    connectionUpdateInterval: 60,

    // Candidatos por ponto
    shortCandidates: 8,
    mediumCandidates: 12,
    longCandidates: 32

};


// ==================================================
// CANVAS
// ==================================================

const canvas = document.getElementById("gameCanvas");

const ctx = canvas.getContext("2d", {
    alpha: true
});

let width, height, dpr;


function resize() {

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

ctx.clearRect(0, 0, width, height);

}

resize();


// ==================================================
// ESTADO
// ==================================================

let points = [];
let edges = [];

let time = 0;
let frame = 0;
let scale = 1;

let centers = [];

let originalCenterX = 0;
let originalCenterY = 0;


// ==================================================
// ALEATORIEDADE
// ==================================================

function random(min, max) {
    return min + Math.random() * (max - min);
}


function gaussian() {

    const u = Math.max(Math.random(), 0.0001);
    const v = Math.random();

    return Math.sqrt(-2 * Math.log(u)) *
           Math.cos(2 * Math.PI * v);

}


// ==================================================
// GRADE ESPACIAL
// ==================================================

function createSpatialGrid(cellSize) {

    const grid = new Map();

    for (let i = 0; i < points.length; i++) {

        const p = points[i];

        const gx = Math.floor(p.x / cellSize);
        const gy = Math.floor(p.y / cellSize);

        const key = gx + "," + gy;

        let cell = grid.get(key);

        if (!cell) {
            cell = [];
            grid.set(key, cell);
        }

        cell.push(i);

    }

    return grid;

}


function getGridCell(grid, x, y) {
    return grid.get(x + "," + y) || [];
}


// ==================================================
// AMOSTRAGEM SEM REPETIÇÃO
// ==================================================

function reservoirSample(items, limit) {

    if (items.length <= limit) {
        return items.slice();
    }

    const result = items.slice(0, limit);

    for (let i = limit; i < items.length; i++) {

        const j = Math.floor(Math.random() * (i + 1));

        if (j < limit) {
            result[j] = items[i];
        }

    }

    return result;

}


// ==================================================
// CENTROS DE DENSIDADE
// ==================================================

function createCenters() {

    centers = [

        {
            x: -0.22,
            y: -0.08,
            phase: 0.4,
            radius: 0.19
        },

        {
            x: 0.02,
            y: 0.12,
            phase: 2.7,
            radius: 0.17
        },

        {
            x: 0.23,
            y: -0.12,
            phase: 4.8,
            radius: 0.20
        }

    ];

}


function getCenterPosition(index) {

    const c = centers[index];
    const t = time * 0.00018;

    return {

        x: width / 2 +
           (c.x + Math.sin(t + c.phase) * 0.075) * scale,

        y: height / 2 +
           (c.y + Math.cos(t * 0.8 + c.phase) * 0.085) * scale

    };

}


// ==================================================
// CRIAÇÃO DA MALHA
// ==================================================

function createMesh() {

    points = [];
    edges = [];

    scale = Math.min(width, height) * config.size;

    createCenters();

    for (let i = 0; i < config.particleCount; i++) {

        let x, y, region;

        const r = Math.random();

        if (r < 0.72) {

            region = Math.floor(Math.random() * 3);

            const c = centers[region];

            x = width / 2 +
                c.x * scale +
                gaussian() * c.radius * scale;

            y = height / 2 +
                c.y * scale +
                gaussian() * c.radius * scale;

        } else {

            region = Math.floor(Math.random() * 2);

            const a = centers[region];
            const b = centers[region + 1];

            const mix = Math.random();

            x = width / 2 +
                (a.x + (b.x - a.x) * mix) * scale +
                gaussian() * scale * 0.07;

            y = height / 2 +
                (a.y + (b.y - a.y) * mix) * scale +
                gaussian() * scale * 0.07;

            region = -1;

        }

        points.push({

            x,
            y,

            vx: random(-0.3, 0.3),
            vy: random(-0.3, 0.3),

            homeX: x,
            homeY: y,

            region,

            phase: random(0, Math.PI * 2),
            noise: random(0, 100),

            deformation: random(0.75, 1.25)

        });

    }

    originalCenterX = points.reduce(
        (sum, p) => sum + p.x, 0
    ) / points.length;

    originalCenterY = points.reduce(
        (sum, p) => sum + p.y, 0
    ) / points.length;

    createConnections();

}


// ==================================================
// DEFORMAÇÃO ORGÂNICA
// ==================================================

function getDeformedPosition(p) {

    const t = time * 0.00022;

    const ox = p.homeX - originalCenterX;
    const oy = p.homeY - originalCenterY;

    const stretchX =
        1 + Math.sin(t * 0.65) * config.stretchAmount;

    const stretchY =
        1 + Math.cos(t * 0.53 + 1.7) *
        config.stretchAmount * 0.55;

    let x = ox * stretchX * p.deformation;
    let y = oy * stretchY * p.deformation;

    const twist =
        Math.sin(oy * 0.003 + t * 1.1) *
        config.twistAmount;

    x += oy * twist;

    y += Math.sin(ox * 0.0035 - t * 0.8) *
         config.twistAmount * 65;

    const wave1 =
        Math.sin(ox * 0.004 - t * 1.5 + p.phase);

    const wave2 =
        Math.cos(oy * 0.005 + t * 1.2 + p.noise);

    x += wave2 * config.waveAmount * 110;
    y += wave1 * config.waveAmount * 110;

    const angle =
        Math.sin(t * 0.48) * 0.55 +
        Math.sin(t * 0.19 + 2) * 0.32;

    const cos = Math.cos(angle);
    const sin = Math.sin(angle);

    const rx = x * cos - y * sin;
    const ry = x * sin + y * cos;

    return {

        x: originalCenterX + rx,
        y: originalCenterY + ry

    };

}


// ==================================================
// MOVIMENTO DOS PONTOS
// ==================================================

function updatePoints() {

    const t = time * 0.001;

    let cx = 0;
    let cy = 0;

    for (let i = 0; i < points.length; i++) {

        cx += points[i].x;
        cy += points[i].y;

    }

    cx /= points.length;
    cy /= points.length;


    // Forças individuais

    for (let i = 0; i < points.length; i++) {

        const p = points[i];

        const phase = t + p.phase;

        let fx = 0;
        let fy = 0;

        // Movimento independente

        fx += Math.sin(phase * 1.3 + p.noise) *
              config.movement;

        fy += Math.cos(phase * 1.1 + p.phase) *
              config.movement;

        // Perturbações

        fx += Math.sin(phase * 2.3 + p.noise) *
              config.chaos;

        fy += Math.cos(phase * 1.9 + p.phase) *
              config.chaos;

        // Deformação principal

        const target = getDeformedPosition(p);

        fx += (target.x - p.x) *
              config.deformationStrength;

        fy += (target.y - p.y) *
              config.deformationStrength;

        // Atração regional

        if (p.region >= 0) {

            const c = getCenterPosition(p.region);

            fx += (c.x - p.x) * 0.000055;
            fy += (c.y - p.y) * 0.000055;

        }

        // Coesão global

        fx += (cx - p.x) * config.cohesion;
        fy += (cy - p.y) * config.cohesion;

        // Ruído independente

        fx += random(-0.012, 0.012);
        fy += random(-0.012, 0.012);

        p.vx += fx;
        p.vy += fy;

    }


    // ==================================================
    // REPULSÃO EM DUAS ESCALAS
    // ==================================================

    const grid = createSpatialGrid(
        config.repulsionCellSize
    );

    const cellSize = config.repulsionCellSize;

    const radius = config.repulsionRadius;
    const radiusSq = radius * radius;

    for (let i = 0; i < points.length; i++) {

        const a = points[i];

        const gx = Math.floor(a.x / cellSize);
        const gy = Math.floor(a.y / cellSize);

        const range = Math.ceil(radius / cellSize);

        for (let ox = -range; ox <= range; ox++) {

            for (let oy = -range; oy <= range; oy++) {

                const neighbors = getGridCell(
                    grid,
                    gx + ox,
                    gy + oy
                );

                for (let k = 0; k < neighbors.length; k++) {

                    const j = neighbors[k];

                    if (j <= i) continue;

                    const b = points[j];

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;

                    const distanceSq = dx * dx + dy * dy;

                    if (distanceSq < 0.001 || distanceSq >= radiusSq) {
                        continue;
                    }

                    const distance = Math.sqrt(distanceSq);

                    let force = 0;

                    // Repulsão próxima: mais intensa

                    if (distance < 13) {
                        force += (13 - distance) * 0.009;
                    }

                    // Repulsão intermediária: suave e gradual

                    const falloff = 1 - distance / radius;

                    force +=
                        falloff * falloff *
                        config.repulsionStrength;

                    const fx = dx / distance * force;
                    const fy = dy / distance * force;

                    a.vx -= fx;
                    a.vy -= fy;

                    b.vx += fx;
                    b.vy += fy;

                }

            }

        }

    }


    // Atualização de velocidade

    for (let i = 0; i < points.length; i++) {

        const p = points[i];

        p.vx *= 0.992;
        p.vy *= 0.992;

        const velocity = Math.hypot(p.vx, p.vy);

        if (velocity > config.speed) {

            p.vx = p.vx / velocity * config.speed;
            p.vy = p.vy / velocity * config.speed;

        }

        p.x += p.vx;
        p.y += p.vy;

    }

}


// ==================================================
// ESCOLHA DA ESCALA DAS CONEXÕES
// ==================================================

function chooseConnectionRange() {

    const r = Math.random();

    if (r < config.shortConnections) {

        return random(
            config.minLineLength,
            config.shortRange
        );

    }

    if (
        r <
        config.shortConnections +
        config.mediumConnections
    ) {

        return random(
            config.shortRange,
            config.mediumRange
        );

    }

    return random(
        config.mediumRange,
        config.maxLineLength
    );

}


// ==================================================
// ADICIONA CANDIDATO
// ==================================================

function addCandidate(
    candidates,
    candidateMap,
    i,
    j,
    distance,
    previous
) {

    if (i === j) return;

    const a = Math.min(i, j);
    const b = Math.max(i, j);

    const key = a + "-" + b;

    if (candidateMap.has(key)) return;

    const old = previous.get(key);

    const desiredRange = chooseConnectionRange();

    const scalePreference =
        Math.exp(
            -Math.abs(distance - desiredRange) / 45
        );

    const candidate = {

        a,
        b,
        distance,

        restLength: old
            ? old.restLength
            : distance,

        phase: old
            ? old.phase
            : random(0, Math.PI * 2),

        score:
            Math.random() * scalePreference +
            (old ? 1.2 : 0)

    };

    candidateMap.set(key, true);

    candidates.push(candidate);

}


// ==================================================
// CRIAÇÃO DAS CONEXÕES
// ==================================================

function createConnections() {

    const candidates = [];
    const candidateMap = new Map();
    const previous = new Map();

    // Preserva a memória das conexões

    for (let i = 0; i < edges.length; i++) {

        const edge = edges[i];

        previous.set(
            edge.a + "-" + edge.b,
            edge
        );

    }


    // Grade espacial para conexões curtas e médias

    const cellSize = config.connectionCellSize;

    const grid = createSpatialGrid(cellSize);


    // Procura conexões locais

    for (let i = 0; i < points.length; i++) {

        const a = points[i];

        const gx = Math.floor(a.x / cellSize);
        const gy = Math.floor(a.y / cellSize);

        const shortPool = [];
        const mediumPool = [];

        for (let ox = -1; ox <= 1; ox++) {

            for (let oy = -1; oy <= 1; oy++) {

                const neighbors = getGridCell(
                    grid,
                    gx + ox,
                    gy + oy
                );

                for (let k = 0; k < neighbors.length; k++) {

                    const j = neighbors[k];

                    if (j <= i) continue;

                    const b = points[j];

                    const dx = b.x - a.x;
                    const dy = b.y - a.y;

                    const distanceSq = dx * dx + dy * dy;

                    if (
                        distanceSq <
                        config.minLineLength *
                        config.minLineLength
                    ) continue;

                    if (
                        distanceSq >
                        config.mediumRange *
                        config.mediumRange
                    ) continue;

                    const distance = Math.sqrt(distanceSq);

                    if (distance < config.shortRange) {

                        shortPool.push({
                            j,
                            distance
                        });

                    } else {

                        mediumPool.push({
                            j,
                            distance
                        });

                    }

                }

            }

        }


        // Amostra de conexões curtas

        const shortSample = reservoirSample(
            shortPool,
            config.shortCandidates
        );

        for (let k = 0; k < shortSample.length; k++) {

            const candidate = shortSample[k];

            addCandidate(
                candidates,
                candidateMap,
                i,
                candidate.j,
                candidate.distance,
                previous
            );

        }


        // Amostra de conexões médias

        const mediumSample = reservoirSample(
            mediumPool,
            config.mediumCandidates
        );

        for (let k = 0; k < mediumSample.length; k++) {

            const candidate = mediumSample[k];

            addCandidate(
                candidates,
                candidateMap,
                i,
                candidate.j,
                candidate.distance,
                previous
            );

        }

    }


    // Conexões longas por amostragem aleatória

    for (let i = 0; i < points.length; i++) {

        const a = points[i];

        for (
            let k = 0;
            k < config.longCandidates;
            k++
        ) {

            let j = Math.floor(
                Math.random() * points.length
            );

            if (j === i) continue;

            const b = points[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;

            const distanceSq = dx * dx + dy * dy;

            if (
                distanceSq <=
                config.mediumRange * config.mediumRange
            ) continue;

            if (
                distanceSq >
                config.maxLineLength * config.maxLineLength
            ) continue;

            addCandidate(
                candidates,
                candidateMap,
                i,
                j,
                Math.sqrt(distanceSq),
                previous
            );

        }

    }


    // Ordena apenas o conjunto reduzido de candidatos

    candidates.sort((a, b) => b.score - a.score);


    // Distribuição das conexões

    const degree = new Array(points.length).fill(0);

    const targetDegree = new Array(points.length);

    for (let i = 0; i < points.length; i++) {

        targetDegree[i] = Math.floor(
            random(
                config.minConnections,
                config.maxConnections + 1
            )
        );

    }


    edges = [];

    for (let i = 0; i < candidates.length; i++) {

        const edge = candidates[i];

        if (
            degree[edge.a] >= targetDegree[edge.a] ||
            degree[edge.b] >= targetDegree[edge.b]
        ) continue;

        if (
            degree[edge.a] >= config.maxConnections ||
            degree[edge.b] >= config.maxConnections
        ) continue;

        edges.push(edge);

        degree[edge.a]++;
        degree[edge.b]++;

    }

}


// ==================================================
// ELASTICIDADE DAS CONEXÕES
// ==================================================

function updateSprings() {

    for (let i = 0; i < edges.length; i++) {

        const edge = edges[i];

        const a = points[edge.a];
        const b = points[edge.b];

        const dx = b.x - a.x;
        const dy = b.y - a.y;

        const distance = Math.hypot(dx, dy);

        if (distance < 0.001) continue;

        const variation =
            1 + Math.sin(
                time * 0.00028 + edge.phase
            ) * config.springVariation;

        const target = edge.restLength * variation;

        const force =
            (distance - target) * config.springStrength;

        const fx = dx / distance * force;
        const fy = dy / distance * force;

        a.vx += fx;
        a.vy += fy;

        b.vx -= fx;
        b.vy -= fy;

    }

}


// ==================================================
// DESENHO
// ==================================================

function drawMesh() {

    ctx.clearRect(0, 0, width, height);

    ctx.lineWidth = config.lineWidth;
    ctx.strokeStyle = config.lineColor;
    ctx.lineCap = "round";

    ctx.beginPath();

    const maxDistanceSq =
        config.maxLineLength *
        config.maxLineLength;

    for (let i = 0; i < edges.length; i++) {

        const edge = edges[i];

        const a = points[edge.a];
        const b = points[edge.b];

        const dx = b.x - a.x;
        const dy = b.y - a.y;

        if (
            dx * dx + dy * dy >
            maxDistanceSq
        ) continue;

        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);

    }

    ctx.stroke();

}


// ==================================================
// ANIMAÇÃO
// ==================================================

function animate(timestamp) {

    time = timestamp;

    updatePoints();

    updateSprings();

    drawMesh();

    frame++;

    requestAnimationFrame(animate);

}


// ==================================================
// INICIALIZAÇÃO
// ==================================================

createMesh();

requestAnimationFrame(animate);


// ==================================================
// REDIMENSIONAMENTO
// ==================================================

window.addEventListener("resize", () => {

    resize();

    createMesh();

});

})();

</script>

<script>

/* =====================================================
   MENU AND CONTENT
===================================================== */

const contentWindow = document.getElementById("contentWindow");
const contentText = document.getElementById("contentText");

const realizationItems = document.querySelectorAll(".realizationItem");
const sectionItems = document.querySelectorAll(".menuItem[data-section]");


/* =====================================================
   GOOGLE DOCS DOCUMENTS
===================================================== */

/* CURRÍCULO */

const curriculumURL =
    "https://docs.google.com/document/d/e/2PACX-1vTS1OYUMlFCzGvgsddqiGVi9nUt_ZqZG2aZbArTTmldwmwdSdFXiZVp0Z3YZQXMmVUwaSQe57r78GMv/pub?embedded=true";

/* PORTFÓLIO */

const portfolioURL =
    "https://docs.google.com/document/d/e/2PACX-1vSVdDqITFGfC_bmcFBeMWz_RlUDwsDlTE0jA3YgPmMpIFVAm9v4Pwe_SpoQmJART2ZRHsuOXtEPNtE_/pub?embedded=true";

/* =====================================================
   OPEN CONTENT
===================================================== */

function openContent(title) {

    contentText.innerHTML = "";
    contentWindow.scrollTop = 0;

    if (title === "Currículo" || title === "Portfólio") {

        const frame = document.createElement("iframe");

        frame.className = "documentFrame";

        if (title === "Currículo") {
            frame.src = curriculumURL + "&teste=" + Date.now();
            frame.title = "Currículo de bernardo stumpf";
        }

        if (title === "Portfólio") {
            frame.src = portfolioURL;
            frame.title = "Portfólio de bernardo stumpf";
        }

        contentText.appendChild(frame);

    } else {

        contentText.textContent = title;
    }

    contentWindow.classList.add("open");
}


/* =====================================================
   CLOSE CONTENT
===================================================== */

function closeContent() {

    contentWindow.classList.remove("open");
    contentWindow.scrollTop = 0;
}


/* =====================================================
   REALIZATION ITEMS
===================================================== */

realizationItems.forEach(item => {

    item.addEventListener("click", () => {

        const number = item.dataset.realization;

        openContent(
            "Conteúdo da realização " + number + "."
        );

    });

});


/* =====================================================
   CURRICULUM AND PORTFOLIO
===================================================== */

sectionItems.forEach(item => {

    item.addEventListener("click", () => {

        const section = item.dataset.section;

        if (section === "curriculo") {
            openContent("Currículo");
        }

        if (section === "portfolio") {
            openContent("Portfólio");
        }

    });

});


/* =====================================================
   CLICK OUTSIDE
===================================================== */

document.addEventListener("pointerdown", event => {

    if (!contentWindow.classList.contains("open")) {
        return;
    }

    if (contentWindow.contains(event.target)) {
        return;
    }

    closeContent();

});


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
        closeContent();
    }

});

</script>
