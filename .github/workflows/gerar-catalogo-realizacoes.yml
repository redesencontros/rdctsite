name: Gerar catálogo de realizações

on:
  push:
    paths:
      - 'ativos/realizacoes/**'
      - 'scripts/gerar_catalogo_realizacoes.py'
      - '.github/workflows/gerar-catalogo-realizacoes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerar catálogo
        run: python scripts/gerar_catalogo_realizacoes.py

      - name: Salvar catálogo no repositório
        run: |
          if [[ -n "$(git status --porcelain ativos/realizacoes/catalogo.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ativos/realizacoes/catalogo.json
            git commit -m "Atualiza catálogo de realizações"
            git push
          else
            echo "Catálogo já está atualizado."
          fi
